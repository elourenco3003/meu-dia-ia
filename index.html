  </div><div class="foot">Vale para este aparelho.</div></section>`;

function travelSection(){
  return `<section><div class="sh">Hora de sair</div><div class="group">
    <div class="row"><span class="main"><div class="t">Avisar a hora de sair</div><div class="s">Para compromissos com local</div></span><label class="switch"><input type="checkbox" id="set-travel" ${S.travel_on ? 'checked' : ''} aria-label="Avisar a hora de sair"><span></span></label></div>
    <label class="row" for="pref-arr"><span class="main t">Chegar antes</span>

function withNumber(addr, n){
  n = String(n).trim(); if (!n) return addr;
  const parts = addr.split(', ');
  if (parts.some(p => p.trim() === n)) return addr;
  if (parts.length === 1) return `${addr}, ${n}`;
  parts.splice(1, 0, n); return parts.join(', ');
}
const cepOf = q => { const d = String(q).replace(/\D/g, ''); return /^\s*\d{5}-?\d{3}\s*$/.test(q) ? d : ''; };
async function viaCep(cep){
  try {
    const j = await fetch(`https://viacep.com.br/ws/${cep}/json/`).then(r => r.json());
    if (!j || j.erro) return null;
    return { street: j.logradouro || '', district: j.bairro || '', city: j.localidade || '', uf: j.uf || '', cep: j.cep || cep };
  } catch(e) { return null; }
}
function bindPlace(inp){
  const box = document.getElementById('s-' + inp.id.slice(2)), hint = document.getElementById('h-' + inp.id.slice(2));
  let t = null, seq = 0;
  const clearGeo = () => { delete inp.dataset.lat; delete inp.dataset.lon; delete inp.dataset.label; };
  const show = items => {
    if (!items.length){ box.hidden = true; box.innerHTML = ''; return; }
    box.innerHTML = items.map((it, i) => `<button type="button" class="sug-it" data-i="${i}">${ic(it.cep ? 'search' : 'nav')}<span><b>${esc(it.name)}</b>${it.address ? `<small>${esc(it.address)}</small>` : ''}</span></button>`).join('');
    box.hidden = false;
    box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      const it = items[Number(b.dataset.i)];
      if (it.cep){
        // CEP: preenche rua, bairro e cidade; a pessoa completa o número
        inp.value = [it.street, it.district, it.city && `${it.city} - ${it.uf}`].filter(Boolean).join(', ');
        clearGeo(); hint.textContent = 'Agora digite o número no campo Nº.'; hint.hidden = false;
        const nf = document.getElementById('n-' + inp.id.slice(2)); if (nf) nf.focus();
      } else {
        inp.value = it.address && it.address !== it.name ? `${it.name} - ${it.address}` : it.name;
        inp.dataset.lat = it.lat; inp.dataset.lon = it.lon; inp.dataset.label = it.name;
        hint.textContent = 'Local encontrado no mapa.'; hint.hidden = false;
      }
      box.hidden = true; box.innerHTML = '';
    });
  };
  inp.addEventListener('input', () => {
    clearGeo(); hint.hidden = true; clearTimeout(t);
    const q = inp.value.trim(), my = ++seq;
    if (q.length < 3){ show([]); return; }
    t = setTimeout(async () => {
      const cep = cepOf(q);
      if (cep){
        const c = await viaCep(cep); if (my !== seq) return;
        if (!c){ show([]); hint.textContent = 'CEP não encontrado.'; hint.hidden = false; return; }
        show([{ cep:true, ...c, name: c.street || `${c.city} - ${c.uf}`, address: [c.district, `${c.city} - ${c.uf}`, `CEP ${c.cep}`].filter(Boolean).join(', ') }]);
        return;
      }
      box.innerHTML = '<div class="sug-wait">Buscando…</div>'; box.hidden = false;
      const p = wxPos();
      const { data } = await sb.functions.invoke('rota', { body:{ action:'search', q, lat: p && p.lat, lon: p && p.lon } });
      if (my !== seq) return;
      const res = (data && data.results) || [];
      show(res);
      if (!res.length){ hint.textContent = 'Nada encontrado com esse nome. Tente o endereço ou o CEP.'; hint.hidden = false; }
    }, 450);
  });
}

function histChart(pts, kind, unit){
  if (!pts || pts.length < 2) return '<div class="empty">Sem histórico disponível.</div>';
  if (/^\d{2}\/\d{2}$/.test(pts[0][0])) pts = pts.slice(-12);           // diário: últimos 12 dias úteis
  const ys = pts.map(p => p[1]), money = unit === '' || unit === 'US$', cur = unit === 'US$' ? 'US$' : 'R$';
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (money){ lo = lo - (hi - lo) * .6; } else { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }   // dólar: escala a partir de perto do mínimo
  const span = (hi - lo) || 1, zero = money ? 0 : (0 - lo) / span * 100;
  const lbl = k => /^\d{4}-\d{2}$/.test(k) ? ymLbl(k).replace(/\/\d{2}(\d{2})$/, '/$1') : k;
  const fmt = v => money ? `${cur} ${n2(v, cur === 'US$' ? 0 : 2)}` : `${v > 0 && kind === 'bar' ? '+' : ''}${n2(v)}%`;
  const rows = pts.map((p, i) => {
    const v = p[1], w = Math.abs(v - (money ? lo : 0)) / span * 100, left = money ? 0 : v < 0 ? zero - w : zero;
    return `<div class="hb-row ${i === pts.length - 1 ? 'last' : ''}"><span class="hb-m">${esc(lbl(p[0]))}</span>
      <span class="hb-track">${money ? '' : `<i class="hb-zero" style="left:${zero}%"></i>`}<b class="hb-bar ${v < 0 ? 'neg' : ''}" style="left:${left}%;width:${Math.max(w, .8)}%"></b></span>
      <span class="hb-v ${v < 0 ? 'neg' : ''}">${fmt(v)}</span></div>`;
  }).join('');
  return `<div class="hbars">${rows}</div>
    <div class="hc-mm"><span>mín ${fmt(Math.min(...ys))}</span><span>máx ${fmt(Math.max(...ys))}</span></div>`;
}

  const spent = Number(ai.spent_usd), budget = Number(ai.budget_usd), left = Math.max(budget - spent, 0);
  const pct = budget ? Math.min(spent / budget * 100, 100) : 0;
  const plans = Object.assign({ free:0, plus:0, familia:0 }, d.plans);
  const paid = Object.assign({ plus:0, familia:0 }, d.paid);
  const mrr = paid.plus * PLAN_PRICE.plus + paid.familia * PLAN_PRICE.familia;
  const per = 8, pages = Math.max(1, Math.ceil(d.list.length / per));
  adminPage = Math.min(Math.max(adminPage, 0), pages - 1);
  const rows = d.list.slice(adminPage * per, adminPage * per + per);
  const kpi = (label, n) => `<div class="tile kpi"><span class="tx"><div class="lab">${label}</div><div class="n">${Number(n).toLocaleString('pt-BR')}</div></span></div>`;
  return `${head}
  <div class="tiles">
    ${kpi('Usuários (un)', d.users)}
    ${kpi('Novos em 7 dias (un)', d.new_7d)}
    ${kpi('Ativos em 7 dias (un)', d.active_7d)}
    ${kpi('Com alertas ativos (un)', d.users_with_alerts)}
  </div>
  <section>
    <div class="sh">Planos</div>
    <div class="group">
      ${['free','plus','familia'].map(k => `<div class="row"><span class="main t">${PLAN_NAME[k]}</span><span class="n" style="font-weight:700;font-variant-numeric:tabular-nums">${plans[k]} un</span></div>`).join('')}
      <div class="row"><span class="main t">Acesso grátis (cortesia e família)</span><span class="n" style="font-weight:700;font-variant-numeric:tabular-nums">${d.free_access || 0} un</span></div>
      <div class="row"><span class="main"><div class="t">Receita mensal estimada</div><div class="s">Só assinaturas pagas: ${paid.plus} Plus · ${paid.familia} Família</div></span>${acc(mrr)}</div>
    </div>
    <div class="foot">Plus R$ 19,90 (100 mensagens por dia) e Família R$ 34,90 (2 pessoas, 100 por dia cada) por mês; anual por 10 mensalidades. Cortesias (você, a Renata) e quem entra pela família de alguém não geram receita.</div>
  </section>
  <section>
    <div class="sh">Inteligência artificial<button data-act="admin-budget">Atualizar crédito</button></div>
    <div class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><b>Crédito usado</b><span style="font-variant-numeric:tabular-nums">${usd(spent)} de ${usd(budget)}</span></div>
      <div class="meter" role="img" aria-label="${Math.round(pct)}% do crédito usado"><span style="width:${pct}%;background:${pct >= 80 ? 'var(--bad)' : 'var(--accent)'}"></span></div>
      <div class="s" style="color:var(--fg2);font-size:13px">Restam ${usd(left)} · contando desde ${String(ai.since || '').slice(0, 10).split('-').reverse().join('/')}</div>
    </div>
    <div class="group" style="margin-top:10px">
      <div class="row"><span class="main"><div class="t">Gasto hoje</div><div class="s">${usd(ai.today_usd)}</div></span>${brlOf(ai.today_usd)}</div>
      <div class="row"><span class="main"><div class="t">Gasto em 30 dias</div><div class="s">${usd(ai.d30_usd)}</div></span>${brlOf(ai.d30_usd)}</div>
      <div class="row"><span class="main t">Mensagens ao assistente em 30 dias</span><span style="font-weight:700;font-variant-numeric:tabular-nums">${ai.msgs_30d} un</span></div>
      <div class="row"><span class="main t">Alertas enviados em 7 dias</span><span style="font-weight:700;font-variant-numeric:tabular-nums">${d.alerts_7d} un</span></div>
    </div>
    <div class="foot">Reais convertidos a R$ ${fx.toLocaleString('pt-BR', { minimumFractionDigits:2 })} por dólar. Ao comprar mais crédito na Anthropic, toque em Atualizar crédito.</div>
  </section>
  <section>
    <div class="sh">Usuários (${d.list.length} un)</div>
    <div class="group">
      ${rows.map(u => `<button class="row" data-auser="${u.id}">
        <span class="main"><div class="t">${esc(nameCase(u.name) || '(sem nome)')}${u.is_admin ? ' <span class="chip tint">admin</span>' : ''}${u.confirmed ? '' : ' <span class="chip warn">e-mail não confirmado</span>'}</div>
          <div class="s">${esc(u.email || '')} · desde ${fmtD(u.created_at)} · ${u.msgs_30d} msg em 30 dias · ${u.devices} aparelho${u.devices == 1 ? '' : 's'} com alerta</div></span>
        <span class="right"><span class="chip ${u.plan === 'free' ? '' : 'good'}">${PLAN_NAME[u.plan] || u.plan}${u.plan !== 'free' && u.plan_source !== 'assinatura' ? (u.plan_source === 'familia' ? ' · via família' : ' · cortesia') : ''}</span><span style="font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums">${usd(u.cost_30d)}</span></span>
      </button>`).join('') || '<div class="empty">Nenhum usuário.</div>'}
    </div>
    ${pages > 1 ? `<div class="pager" style="margin-top:10px"><button class="icon-btn" data-apage="-1" aria-label="Página anterior" ${adminPage === 0 ? 'disabled' : ''}>${ic('l')}</button><span class="lbl" style="text-transform:none">Página ${adminPage + 1} de ${pages}</span><button class="icon-btn" data-apage="1" aria-label="Próxima página" ${adminPage >= pages - 1 ? 'disabled' : ''}>${ic('r')}</button></div>` : ''}
    <div class="foot">Toque em um usuário para mudar o plano manualmente, por exemplo para dar Plus a quem está testando. O painel não mostra agendas, finanças nem conversas dos usuários.</div>
  </section>`;
}
function openUserPlan(id){
  const u = adminData && adminData.list.find(x => x.id === id); if (!u) return;
  openForm({
    title: u.name || u.email, saveLabel: 'Salvar',
    fields: [{ k:'plan', label:'Plano', type:'select', options:[['free','Free'],['plus','Plus'],['familia','Família']] }],
    values: { plan: u.plan },
    onSave: async v => {
      const { error } = await sb.rpc('admin_set_plan', { p_user: id, p_plan: v.plan }); if (error) throw error;
      adminData = null; return `Plano alterado para ${PLAN_NAME[v.plan]}`;
    },
  });
}
function openBudget(){
  const ai = adminData.ai;
  openForm({
    title: 'Crédito da IA', saveLabel: 'Salvar',
    fields: [{ k:'cents', label:'Crédito comprado (US$)', type:'money', req:1 }, { k:'since', label:'Contar gastos desde', type:'date', req:1 }],
    values: { cents: Math.round(Number(ai.budget_usd) * 100), since: String(ai.since || '').slice(0, 10) },
    onSave: async v => {
      const { error } = await sb.rpc('admin_set_ai_budget', { p_usd: v.cents / 100, p_since: v.since }); if (error) throw error;
      adminData = null; return 'Crédito atualizado';
    },
  });
}

/* ---------- alertas no celular (Web Push) ---------- */
const VAPID_PUB = 'BDgwg6S3VsklJoKIWEaW5-z7AoGakq7C3AiwFy5TrjgAbpbB9Uq0o7DVFlDkSOLHkK7OYRed_DzTjZ5fz7t-39A';
const PUSH_KINDS = ['lembrete','sair','compromisso','vencer','vencida','pendente','resumo','noticia'];
const PUSH_TXT = {
  ativo: 'Você recebe os alertas mesmo com o app fechado.',
  desligado: 'Toque em Ativar e permita as notificações.',
  bloqueado: 'Bloqueados. Libere as notificações deste site nas configurações do navegador.',
  instalar: 'No iPhone, instale o app na tela inicial (Compartilhar → Adicionar à Tela de Início) e abra por lá.',
  'sem-suporte': 'Este navegador não recebe alertas. Use o Chrome no Android ou o app instalado no iPhone.',
};
let pushOn = false;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function pushState(){
  if (isIOS && !isStandalone()) return 'instalar';
  if (!pushSupported()) return 'sem-suporte';
  if (Notification.permission === 'denied') return 'bloqueado';
  if (Notification.permission === 'granted' && pushOn) return 'ativo';
  return 'desligado';
}
function pushBanner(){
  const st = pushState();
  if (st !== 'desligado' && st !== 'instalar') return '';
  let later = 0; try { later = Number(localStorage.getItem('meudia.pushlater')) || 0; } catch(e) {}
  if (Date.now() - later < 3 * 864e5) return '';
  return `<div class="banner"><span style="flex:1">${st === 'instalar' ? 'Para receber alertas com o app fechado, instale o app: Compartilhar → Adicionar à Tela de Início.' : 'Ative os alertas para receber lembretes e contas mesmo com o app fechado.'}</span>
    ${st === 'desligado' ? '<button data-act="push-on">Ativar</button>' : ''}<button data-act="push-later" style="color:var(--fg2)">${st === 'desligado' ? 'Agora não' : 'Entendi'}</button></div>`;
}
function b64u(str){ const pad = '='.repeat((4 - str.length % 4) % 4); const raw = atob((str + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); }
async function subscribePush(){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUB) });
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent.slice(0, 200) });
  if (error) throw error;
  pushOn = true;
}
async function enablePush(){
  const st = pushState();
  if (st !== 'desligado'){ toast(PUSH_TXT[st]); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted'){ toast('Sem permissão, os alertas não chegam com o app fechado.'); render(); return; }
  try { await subscribePush(); play('lembrete', true); toast('Alertas ativados neste aparelho'); }
  catch(e){ console.error(e); toast('Não foi possível ativar os alertas. Tente de novo.'); }
  render();
}
async function refreshPush(){
  if (!pushSupported() || Notification.permission !== 'granted' || (isIOS && !isStandalone())) return;
  try { await subscribePush(); } catch(e) { console.error(e); }
}
async function unsubscribePush(){
  try {
    const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
    if (sub){ await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  } catch(e) { console.error(e); }
  pushOn = false;
}
async function testPush(){
  const { data, error } = await sb.functions.invoke('notificar', { body: { test: true } });
  if (error || !data || !data.sent) toast('O alerta não chegou a nenhum aparelho. Ative os alertas e tente de novo.');
  else toast('Alerta de teste enviado. Ele deve aparecer em instantes.');
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'push' && d.kind === 'sairja'){ const ev = S.events.find(x => x.id === d.ref); alarmFire(ev || null); return; }
  if (d.type === 'push' && document.visibilityState === 'visible' && TONES[d.kind]) play(d.kind);
  if (d.type === 'open' && d.url){ const r = new URL(d.url, location.origin).searchParams.get('rota'); if (r) openRoute(r); }
});

function checkReminders(){
  if (!session || pushOn) return;
  const now = Date.now();
  S.rems.forEach(r => {
    if (r.done || S.fired[r.id] || !r.time) return;
    const [y,m,d] = r.date.split('-').map(Number), [hh,mm] = r.time.split(':').map(Number);
    const at = new Date(y, m-1, d, hh, mm).getTime() - (r.adv||0)*60000;
    if (now >= at && now - at < 5*60000){
      S.fired[r.id] = 1; save(); play('lembrete');
      toast(`${ic('bell')}<span><b>${esc(r.title)}</b> · ${r.adv ? ADV[r.adv].replace(' antes',' para') + ' às ' + r.time : 'agora'}</span>`);
    }
  });
}
setInterval(checkReminders, 20000);
document.addEventListener('keydown', e => { if (e.key==='Escape'){ if (!$('#sheet').hidden){ $('#sheet').hidden = true; $('#sheet').innerHTML=''; }  } });

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
})();
</script>
