const ZXING_CDN = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
function carregaScript(src){
  return new Promise((ok, erro) => {
    if ([...document.scripts].some(x => x.src === src)) return ok();
    const t = document.createElement('script'); t.src = src; t.async = true;
    t.onload = () => ok(); t.onerror = () => erro(new Error('script'));
    document.head.appendChild(t);
  });
}
async function abrirScanner(aoAchar){
  let el = $('#scan');
  if (!el){ el = document.createElement('div'); el.id = 'scan'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Ler o código de barras'); document.body.appendChild(el); }
  el.innerHTML = `<div class="sc-bar"><button data-x>Fechar</button><b>Código de barras</b><span style="min-width:64px"></span></div>
    <div class="sc-view"><video id="sc-v" playsinline muted autoplay></video><div class="sc-alvo"></div></div>
    <div class="sc-tip" id="sc-tip">Aponte para o código de barras da caixa. Firme, com boa luz.</div>`;
  el.hidden = false;
  const v = el.querySelector('#sc-v'), tip = t => { const x = el.querySelector('#sc-tip'); if (x) x.textContent = t; };
  let stream = null, vivo = true, ctrl = null;
  const fechar = () => {
    vivo = false;
    try { if (ctrl && ctrl.stop) ctrl.stop(); } catch(e) {}
    if (stream) stream.getTracks().forEach(t => t.stop());
    el.hidden = true; el.innerHTML = '';
  };
  el.querySelector('[data-x]').onclick = fechar;
  const achou = async codigo => {
    const ean = String(codigo || '').replace(/\D/g, '');
    if (!vivo || ean.length < 8) return;
    vivo = false;
    if (navigator.vibrate) navigator.vibrate(60);
    play('concluida');
    tip('Procurando na lista da Anvisa…');
    let med = null;
    try { const { data } = await sb.rpc('medicamento_por_ean', { p_ean: ean }); med = (data || [])[0] || null; } catch(e) {}
    fechar();
    aoAchar(med, ean);
  };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } } });
  } catch(e) {
    tip('Não consegui abrir a câmera. Autorize o acesso à câmera para este site e tente de novo.');
    return;
  }
  v.srcObject = stream; try { await v.play(); } catch(e) {}
  // Android e Chrome já leem código de barras sozinhos; no iPhone entra a biblioteca
  if ('BarcodeDetector' in window){
    try {
      const det = new window.BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128'] });
      const olha = async () => {
        if (!vivo) return;
        try { const r = await det.detect(v); if (r && r[0]) return achou(r[0].rawValue); } catch(e) {}
        setTimeout(olha, 220);
      };
      olha();
      return;
    } catch(e) {}
  }
  try {
    await carregaScript(ZXING_CDN);
    const B = window.ZXingBrowser || window.ZXing;
    const leitor = new B.BrowserMultiFormatReader();
    const cb = res => { if (res && vivo) achou(res.getText ? res.getText() : res.text); };
    if (leitor.decodeFromVideoElement) ctrl = await leitor.decodeFromVideoElement(v, cb);
    else if (leitor.decodeFromStream) ctrl = await leitor.decodeFromStream(stream, v, cb);
    else if (leitor.decodeFromConstraints) ctrl = await leitor.decodeFromConstraints({ video: { facingMode: 'environment' } }, v, cb);
    else tip('Este aparelho não lê código de barras. Digite o nome do remédio.');
  } catch(e) {
    tip('Não consegui carregar o leitor. Confira a internet ou digite o nome do remédio.');
  }
}

function bindMed(inp){

    if (error || !data) return;
    const lista = [...new Set(data.map(d => d.dosagem).filter(Boolean))].slice(0, 8);
    if (!lista.length) return;

    });

  if (cam) cam.onclick = () => abrirScanner((med, ean) => {
    box.hidden = true; box.innerHTML = '';

      hint.textContent = `Código ${ean} não está na lista da Anvisa. Digite o nome.`; hint.hidden = false;
      inp.focus(); return;
    }
    inp.value = med.produto;
    hint.textContent = [med.substancia, med.laboratorio].filter(Boolean).join(' · ') || 'Medicamento registrado na Anvisa';
    hint.hidden = false;
    const f = document.getElementById('f-dose');
    if (f && med.dosagem) f.value = med.dosagem.toLowerCase();
    doses(med.produto);
    toast('Remédio identificado pela caixa');
  });
  inp.addEventListener('input', () => {
    hint.hidden = true; clearTimeout(t);
    const q = inp.value.trim(), my = ++seq;
    if (q.length < 3){ box.hidden = true; box.innerHTML = ''; return; }
    t = setTimeout(async () => {
      let res = [];
      try { const { data } = await sb.rpc('busca_medicamento', { p_termo: q, p_limite: 8 }); res = data || []; } catch(e) { res = []; }
      if (my !== seq) return;
      if (!res.length){ box.hidden = true; box.innerHTML = ''; return; }
      box.innerHTML = res.map((x, i) => `<button type="button" class="sug-it" data-i="${i}">${ic('pill')}<span><b>${esc(x.produto)}</b>${x.substancia && x.substancia !== x.produto ? `<small>${esc(x.substancia)}</small>` : ''}</span></button>`).join('');
      box.hidden = false;
      box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
        const x = res[Number(b.dataset.i)];
        inp.value = x.produto; box.hidden = true; box.innerHTML = '';
        hint.textContent = x.substancia && x.substancia !== x.produto ? x.substancia : 'Medicamento registrado na Anvisa';
        hint.hidden = false;
        doses(x.produto);
      });
    }, 250);
  });
}
function bindPlace(inp){
  const box = document.getElementById('s-' + inp.id.slice(2)), hint = document.getElementById('h-' + inp.id.slice(2));
  let t = null, seq = 0;
  const clearGeo = () => { delete inp.dataset.lat; delete inp.dataset.lon; delete inp.dataset.label; };
  const show = items => {
    if (!items.length){ box.hidden = true; box.innerHTML = ''; return; }
    box.innerHTML = items.map((it, i) => `<button type="button" class="sug-it" data-i="${i}">${ic(it.cep ? 'search' : 'nav')}<span><b>${esc(it.name)}</b>${it.address ? `<small>${esc(it.address)}</small>` : ''}</span></button>`).join('');
    box.hidden = false;
    box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      const it = items[Number(b.dataset.i)];
      if (it.cep){
        // CEP: preenche rua, bairro e cidade; a pessoa completa o número
        inp.value = [it.street, it.district, it.city && `${it.city} - ${it.uf}`].filter(Boolean).join(', ');
        clearGeo(); hint.textContent = 'Agora digite o número no campo Nº.'; hint.hidden = false;
        const nf = document.getElementById('n-' + inp.id.slice(2)); if (nf) nf.focus();
      } else {
        inp.value = it.address && it.address !== it.name ? `${it.name} - ${it.address}` : it.name;
        inp.dataset.lat = it.lat; inp.dataset.lon = it.lon; inp.dataset.label = it.name;
        hint.textContent = 'Local encontrado no mapa.'; hint.hidden = false;
      }
      box.hidden = true; box.innerHTML = '';
    });
  };
  inp.addEventListener('input', () => {
    clearGeo(); hint.hidden = true; clearTimeout(t);
    const q = inp.value.trim(), my = ++seq;
    if (q.length < 3){ show([]); return; }
    t = setTimeout(async () => {
      const cep = cepOf(q);
      if (cep){
        const c = await viaCep(cep); if (my !== seq) return;
        if (!c){ show([]); hint.textContent = 'CEP não encontrado.'; hint.hidden = false; return; }
        show([{ cep:true, ...c, name: c.street || `${c.city} - ${c.uf}`, address: [c.district, `${c.city} - ${c.uf}`, `CEP ${c.cep}`].filter(Boolean).join(', ') }]);
        return;
      }
      box.innerHTML = '<div class="sug-wait">Buscando…</div>'; box.hidden = false;
      const p = wxPos();
      const { data } = await sb.functions.invoke('rota', { body:{ action:'search', q, lat: p && p.lat, lon: p && p.lon } });
      if (my !== seq) return;
      const res = (data && data.results) || [];
      show(res);
      if (!res.length){ hint.textContent = 'Nada encontrado com esse nome. Tente o endereço ou o CEP.'; hint.hidden = false; }
    }, 450);
  });
}

function histChart(pts, kind, unit){
  if (!pts || pts.length < 2) return '<div class="empty">Sem histórico disponível.</div>';
  if (/^\d{2}\/\d{2}$/.test(pts[0][0])) pts = pts.slice(-12);           // diário: últimos 12 dias úteis
  const ys = pts.map(p => p[1]), money = unit === '' || unit === 'US$', cur = unit === 'US$' ? 'US$' : 'R$';
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (money){ lo = lo - (hi - lo) * .6; } else { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }   // dólar: escala a partir de perto do mínimo
  const span = (hi - lo) || 1, zero = money ? 0 : (0 - lo) / span * 100;
  const lbl = k => /^\d{4}-\d{2}$/.test(k) ? ymLbl(k).replace(/\/\d{2}(\d{2})$/, '/$1') : k;
  const fmt = v => money ? `${cur} ${n2(v, cur === 'US$' ? 0 : 2)}` : `${v > 0 && kind === 'bar' ? '+' : ''}${n2(v)}%`;
  const rows = pts.map((p, i) => {
    const v = p[1], w = Math.abs(v - (money ? lo : 0)) / span * 100, left = money ? 0 : v < 0 ? zero - w : zero;
    return `<div class="hb-row ${i === pts.length - 1 ? 'last' : ''}"><span class="hb-m">${esc(lbl(p[0]))}</span>
      <span class="hb-track">${money ? '' : `<i class="hb-zero" style="left:${zero}%"></i>`}<b class="hb-bar ${v < 0 ? 'neg' : ''}" style="left:${left}%;width:${Math.max(w, .8)}%"></b></span>
      <span class="hb-v ${v < 0 ? 'neg' : ''}">${fmt(v)}</span></div>`;
  }).join('');
  return `<div class="hbars">${rows}</div>
    <div class="hc-mm"><span>mín ${fmt(Math.min(...ys))}</span><span>máx ${fmt(Math.max(...ys))}</span></div>`;
}

const VAPID_PUB = 'BDgwg6S3VsklJoKIWEaW5-z7AoGakq7C3AiwFy5TrjgAbpbB9Uq0o7DVFlDkSOLHkK7OYRed_DzTjZ5fz7t-39A';

  if (isIOS && !isStandalone()) return 'instalar';

}

function mouseText(root){
  if (!mouse() || !root) return;
  // só mexe em textos do próprio app (marcados com um caractere invisível); o que a pessoa escreveu nunca é alterado
  const fix = t => t
    .replace(/\u2060Toque e \u2060arraste no gráfico/g, 'Passe o mouse no gráfico')
    .replace(/\u2060[Aa]rraste (o item |um item |)para o lado para (excluir|parar de acompanhar)/g, (m, x, y) => `passe o mouse ${x ? 'no item ' : ''}e clique na lixeira para ${y}`)
    .replace(/\u2060([Tt])oque /g, (m, T) => `${T === 'T' ? 'C' : 'c'}lique `);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()){ if (n.nodeValue.includes('\u2060') && !(n.parentElement && n.parentElement.closest('textarea'))){ const v = fix(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; } }
  root.querySelectorAll('[placeholder]').forEach(el => { if (el.placeholder.includes('\u2060')) el.placeholder = fix(el.placeholder); });
}

/* o quadro ocupa o que sobra da janela; o que não couber vira "+N" no pé da coluna */
function fitBoard(){
  const V = $('#view'), b = V && V.querySelector('.kboard'); if (!b) return;
  if (innerWidth < 900){ b.style.removeProperty('--kbh'); return; }
  b.style.removeProperty('--kbh');
  const topo = b.getBoundingClientRect().top;
  let depois = 0;                                   // o que vier abaixo do quadro (faixa de notícias, nota)
  for (let n = b.nextElementSibling; n; n = n.nextElementSibling) depois += n.getBoundingClientRect().height + 8;
  b.style.setProperty('--kbh', Math.max(240, Math.floor(innerHeight - topo - 14 - depois)) + 'px');
  b.querySelectorAll('.kcards').forEach(box => {
    box.querySelectorAll('.k-more').forEach(x => x.remove());
    const cards = [...box.children].filter(c => c.classList.contains('kc'));
    cards.forEach(c => c.style.display = '');
    const pe = box.getBoundingClientRect().bottom - 2;
    let cabe = cards.length;
    for (let i = 0; i < cards.length; i++) if (cards[i].getBoundingClientRect().bottom > pe){ cabe = i; break; }
    if (cabe < cards.length){
      const mostra = Math.max(1, cabe - 1), resto = cards.length - mostra;
      cards.slice(mostra).forEach(c => c.style.display = 'none');
      const d = document.createElement('div');
      d.className = 'k-more'; d.textContent = `+${resto} ${resto === 1 ? 'cartão' : 'cartões'}`;
      box.appendChild(d);
    }
  });
}

  V.querySelectorAll('.ftab [data-pay]').forEach(b => { const f = b.onclick; b.onclick = e => { e.stopPropagation(); f && f(e); }; });
  requestAnimationFrame(() => fitRows('fin'));
}

/* ----- Listas no computador: listas à esquerda, a lista aberta à direita ----- */
function vListaDesk(){
  const detail = vLista().replace(/^<button class="back"[^]*?<\/button>/, '');
  const rows = S.lists.map(l => { const its = listItems(l.id), left = its.filter(i => !i.done).length;
    return `<button class="row ${l.id === ui.listId ? 'on' : ''}" data-openlist="${l.id}" ${l.user_id === myId() ? `data-swipe="list:${l.id}"` : ''}><span class="set-ic">${ic(l.kind === 'mercado' ? 'cart' : 'list')}</span>
      <span class="main"><div class="t">${esc(l.name)}</div><div class="s">${left ? `${left} faltando` : its.length ? 'Tudo marcado' : 'Vazia'}${l.shared ? ' · compartilhada' : ''}</div></span></button>`; }).join('');
  return `<div class="head"><div><h1 class="lt">Listas e notas</h1><div class="sub">Compras, mercado e o que precisar</div></div>
    <button class="btn-go" data-newlist>${ic('plus')}Nova lista</button></div>
  <div class="seg ln-seg" role="group" aria-label="Mostrar"><button data-lntab="listas" aria-pressed="true">Listas</button><button data-lntab="notas" aria-pressed="false">Notas</button></div>
  <div class="md"><nav class="md-l group" aria-label="Minhas listas">${rows}</nav><div class="md-r">${detail}</div></div>`;
}

})();
</script>
