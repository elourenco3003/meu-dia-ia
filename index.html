<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Dia IA</title>
<meta name="description" content="Seu dia organizado. Sua vida mais leve. Assistente pessoal com IA para agenda, tarefas, contas e lembretes.">
<meta name="theme-color" content="#DEE2FB">
<script>
/* tema: automático pelo horário (padrão), claro, escuro ou igual ao celular; guardado neste aparelho */
function themeCfg(){ try { return Object.assign({ mode:'auto', dark:'18:00', light:'06:00' }, JSON.parse(localStorage.getItem('meudia.theme') || '{}')); } catch(e) { return { mode:'auto', dark:'18:00', light:'06:00' }; } }
function applyTheme(){
  const c = themeCfg(), r = document.documentElement, n = new Date(), hm = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  let t = null;
  if (c.mode === 'claro') t = 'light'; else if (c.mode === 'escuro') t = 'dark';
  else if (c.mode === 'auto') t = (c.dark > c.light ? (hm >= c.dark || hm < c.light) : (hm >= c.dark && hm < c.light)) ? 'dark' : 'light';
  if (t) r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#1C2040' : '#DEE2FB');
}
applyTheme(); setInterval(applyTheme, 60e3);
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Dia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: cartões brancos flutuando sobre degradê lavanda; barra inferior com botão + central; no computador, barra lateral */
:root{
  --bg:#F3F4F9; --top:#DEE2FB; --peach:#F6E8E2; --card:#FFFFFF; --fg:#17181D; --fg2:#878A99; --fg3:#C9CBD6;
  --sep:rgba(23,24,29,.08); --fill:rgba(23,24,29,.05); --pill:rgba(255,255,255,.5);
  --accent:#7B8BE3; --accent-2:#9CA8EF; --accent-soft:rgba(123,139,227,.14);
  --mint:#9ED6BC; --lilac:#D6DAF4; --now:#E5674B;
  --bubble:#17181D; --bubble-fg:#FFFFFF; --sel:#17181D; --sel-fg:#FFFFFF;
  --good:#2F9E6A; --warn:#C27417; --bad:#D9483B; --bar:#FFFFFF; --scrim:rgba(20,22,40,.30);
  --shadow:0 1px 2px rgba(30,34,70,.04),0 10px 28px rgba(30,34,70,.06);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1015; --top:#1C2040; --peach:#271E25; --card:#1B1C23; --fg:#F1F2F6; --fg2:#9497A7; --fg3:#4A4C58;
  --sep:rgba(255,255,255,.08); --fill:rgba(255,255,255,.07); --pill:rgba(255,255,255,.05);
  --accent:#8F9DF0; --accent-2:#A9B4F5; --accent-soft:rgba(143,157,240,.16); --mint:#5FB892; --lilac:#3A3F66; --now:#F07B60;
  --bubble:#F1F2F6; --bubble-fg:#15161B; --sel:#F1F2F6; --sel-fg:#15161B;
  --good:#4CC38A; --warn:#E8A33D; --bad:#F06A5C; --bar:#1B1C23; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.22); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1015; --top:#1C2040; --peach:#271E25; --card:#1B1C23; --fg:#F1F2F6; --fg2:#9497A7; --fg3:#4A4C58;
  --sep:rgba(255,255,255,.08); --fill:rgba(255,255,255,.07); --pill:rgba(255,255,255,.05);
  --accent:#8F9DF0; --accent-2:#A9B4F5; --accent-soft:rgba(143,157,240,.16); --mint:#5FB892; --lilac:#3A3F66; --now:#F07B60;
  --bubble:#F1F2F6; --bubble-fg:#15161B; --sel:#F1F2F6; --sel-fg:#15161B;
  --good:#4CC38A; --warn:#E8A33D; --bad:#F06A5C; --bar:#1B1C23; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.22); color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;overflow-wrap:break-word;word-break:normal;hyphens:manual;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--top) 0,var(--bg) 380px)}
main{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(112px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
main.chat{display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--top) 0,var(--peach) 55%,var(--top) 100%)}
main.chat .wrap{flex:1;min-height:0;width:100%;gap:12px}

/* barra inferior */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  background:var(--bar);border-radius:26px 26px 0 0;box-shadow:0 -6px 26px rgba(30,34,70,.07);
  padding:10px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#tabs [data-v]{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--fg2);padding:4px 0}
#tabs [data-v][aria-current="page"]{color:var(--accent)}
#tabs .brand,#tabs .side-only{display:none}
.fab-cell{position:relative;height:44px}
#fab{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;
  background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;display:grid;place-items:center;
  border:6px solid var(--bg);box-shadow:0 10px 22px rgba(123,139,227,.42)}
#fab svg{width:24px;height:24px;stroke-width:2}
#fab span{display:none}

@media (min-width:900px){
  #app{flex-direction:row}
  #tabs{position:static;width:240px;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:2px;border-radius:0;box-shadow:none;
    border-right:1px solid var(--sep);padding:22px 12px}
  #tabs .brand{display:block;order:-2;padding:4px 10px 16px}
  #tabs .side-only{display:flex}
  #tabs [data-v]{flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;border-radius:12px;color:var(--fg)}
  #tabs [data-v] svg{color:var(--fg2)}
  #tabs [data-v][aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  #tabs [data-v][aria-current="page"] svg{color:var(--accent)}
  .fab-cell{height:auto;order:-1;margin-bottom:12px}
  #fab{position:static;transform:none;width:100%;height:44px;border-radius:12px;border:0;display:flex;gap:8px;justify-content:center;align-items:center;font-weight:600;box-shadow:none}
  #fab span{display:inline}
  main{padding-block:32px 40px}
  main.chat{padding-bottom:24px}
  .back{display:none!important}
}

/* tipografia e cabeçalhos */
.date{color:var(--fg2);font-size:15px;font-weight:500}
.hello{font-size:25px;line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:4px 0 0;text-wrap:balance}
.lt{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:2px 0 0}
.h2{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0}
.sub{color:var(--fg2);font-size:14.5px;margin-top:4px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;font-size:16px;align-self:flex-start;margin-left:-6px}
.chead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.ctitle{margin:0;text-align:center;font-size:18px;font-weight:600}
.topbar{display:flex;justify-content:flex-end;gap:10px}
.round,.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--fg);position:relative;flex:none}
.icon-btn{width:38px;height:38px;color:var(--accent)}
.round svg,.icon-btn svg{width:20px;height:20px}
.avatar{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;box-shadow:none}
.avatar::after{content:"";position:absolute;top:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--now);border:2px solid var(--bg)}
.sh{font-size:13px;color:var(--fg2);font-weight:600;padding:0 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sh button{color:var(--accent);font-weight:600;font-size:14px}
.foot{font-size:13px;color:var(--fg2);padding:8px 4px 0}

/* assistente na tela inicial */
.askbox{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.askbox>svg{color:var(--accent)}
.askbox input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:9px 4px}
.askbox input::placeholder{color:var(--fg2)}
.askbox .mic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);flex:none}
.askbox .mic.rec{background:var(--bad);color:#fff;animation:ouvindo 1.2s ease-in-out infinite}
@keyframes ouvindo{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.askbox .go{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.askbox svg{width:19px;height:19px}
.sugs{display:flex;gap:8px;overflow-x:auto;margin:-10px -16px 0;padding:0 16px}
.sug{flex:none;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--pill);color:var(--fg);border:1px solid var(--sep)}

.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pills button{padding:10px 8px;border-radius:999px;background:var(--pill);color:var(--fg2);font-size:15px;font-weight:500}
.pills button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}

.card,.group,.tile,.sum{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.donutcard{display:flex;align-items:center;gap:18px;padding:16px 18px;margin-top:-8px}
.legend{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-width:0}
.legend div{display:flex;gap:6px;align-items:flex-start;min-width:0}
.legend i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.legend b{display:block;font-size:14px;font-weight:600;white-space:nowrap}
.legend span{font-size:12px;color:var(--fg2)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.tile .ic{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile .ic svg{width:19px;height:19px}
.tile .tx{min-width:0;flex:1}
.tile .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--fg2);font-weight:500}
.tile .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .acc{min-width:0;width:100%;font-size:clamp(12.5px,3.7vw,15px);gap:.4em}
.tile.kpi .n{font-size:24px}
.meter{height:10px;border-radius:999px;background:var(--fill);overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px}
.icon-btn:disabled{opacity:.4}

.list{display:flex;flex-direction:column;gap:10px}
.tcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px 12px 12px;box-shadow:var(--shadow)}
.tcard .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--lilac);flex:none}
.tcard .bar.mint{background:var(--mint)} .tcard .bar.acc2{background:var(--accent)}
.tcard .main{flex:1;min-width:0;text-align:left}
.tcard .t,.ev .t{font-size:15.5px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.tcard .s,.ev .s{font-size:12.5px;color:var(--fg2);margin-top:3px}
.tcard.done .t,.ev.done .t{color:var(--fg2)}
.check,.check2{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--fg3);display:grid;place-items:center;flex:none;color:#fff}
.check.on,.check2.on{background:var(--accent);border-color:var(--accent)}
.check svg,.check2 svg{width:14px;height:14px;stroke-width:2.6}

/* listas (tarefas, lembretes, ajustes, finanças) */
.group{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:50px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.row.ind+.row.ind::before{left:52px}
.row .main{flex:1;min-width:0}
.row .t{font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--fg2);margin-top:2px}
.row .chev{color:var(--fg3);width:16px;height:16px}
.empty{padding:22px 16px;color:var(--fg2);font-size:14.5px;text-align:center}
.done .t{color:var(--fg2);text-decoration:line-through}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.p-alta{background:var(--bad)} .p-media{background:var(--accent)} .p-baixa{background:var(--fg3)}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--fg2);white-space:nowrap}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.tint{background:var(--accent-soft);color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:11px 14px;font-size:13.5px}
.banner button{color:var(--accent);font-weight:700;white-space:nowrap}

/* formato contábil */
.acc{display:inline-flex;justify-content:space-between;gap:.6em;min-width:8.4em;font-variant-numeric:tabular-nums;white-space:nowrap}
.acc.pos{color:var(--good)} .acc.neg{color:var(--bad)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.row .right .acc{min-width:6.8em;font-size:15px}

/* agenda */
.monthrow{display:flex;align-items:center;gap:4px}
.monthrow{min-width:0}
.monthrow .m{font-size:clamp(18px,5.4vw,23px);font-weight:600;letter-spacing:-.02em;text-transform:capitalize;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.monthrow .nav{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.modepill{margin-left:auto;display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:8px 10px 8px 16px;font-size:14px;font-weight:500;box-shadow:var(--shadow)}
.modepill svg{width:16px;height:16px}
.week,.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid{row-gap:6px}
.wd{font-size:13px;color:var(--fg2);text-align:center;font-weight:500;text-transform:capitalize}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.day .d{font-size:15.5px;font-weight:600;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--card);box-shadow:var(--shadow)}
.mgrid .day .d{width:38px;height:38px}
.day.out .d{background:transparent;box-shadow:none;color:var(--fg3)}
.day.today .d{color:var(--accent)}
.day.sel .d{background:var(--sel);color:var(--sel-fg)}
.day .has{width:5px;height:5px;border-radius:50%;background:var(--now)}
.day .has.no{visibility:hidden}
.tl{display:flex;flex-direction:column}
.hr{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;min-height:54px}
.hr .hl{font-size:11px;color:var(--fg2);padding-top:0;transform:translateY(-6px);font-variant-numeric:tabular-nums}
.hr .slot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--sep);padding:8px 0;min-width:0}
.ev{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;min-width:0}
.ev .main{flex:1;min-width:0;text-align:left}
.ev.rem{background:var(--pill);box-shadow:none;border:1px dashed var(--fg3)}
.nowline{height:2px;background:var(--now);position:relative;border-radius:2px;margin:2px 0}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;align-self:center}

/* finanças / tarefas */
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pager .lbl{font-weight:600;font-size:17px;text-transform:capitalize}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{padding:10px 8px;border-radius:999px;background:var(--pill);color:var(--fg2);font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.sum{display:grid;grid-template-columns:repeat(3,1fr)}
.sum>div{padding:14px;min-width:0}
.sum>div+div{border-left:1px solid var(--sep)}
.sum .k{font-size:12.5px;color:var(--fg2);font-weight:500}
.sum .v{font-size:15.5px;font-weight:600;margin-top:4px}
.sum .acc{min-width:0;width:100%}
@media (max-width:420px){.sum .v{font-size:13.5px}.sum>div{padding:12px 10px}}
.pay{font-size:12.5px;font-weight:700;color:var(--accent);padding:6px 11px;border-radius:999px;background:var(--accent-soft);flex:none}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--fill);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.test{color:var(--accent);font-size:14px;font-weight:600;padding:4px 8px}
.danger{color:var(--bad)}
.field-in{flex:1;min-width:0;text-align:right;background:none;border:0;outline:0;font-size:16px;color:var(--fg2)}

/* assistente */
.bot{background:var(--card);color:var(--accent)}
.stamp{text-align:center;font-size:12px;color:var(--fg2);margin-top:-4px}
.quota{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;margin-top:-2px}
.quota[hidden]{display:none}
.quota .qb{width:72px;height:6px;border-radius:3px;background:var(--fill);overflow:hidden;flex:none}
.quota .qb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.quota.warn{color:var(--warn)}.quota.warn .qb i{background:var(--warn)}
.quota.full{color:var(--bad);font-weight:600}.quota.full .qb i{background:var(--bad)}

<script>
(() => {
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => iso(new Date());
const uid = () => Math.random().toString(36).slice(2,10);
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const DOWL = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MONL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ic = (id, cls='i') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const brl = c => (c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const acc = (c, cls='') => `<span class="acc ${cls}"><span>R$</span><span>${brl(c)}</span></span>`;
function rel(s){
  if (!s) return 'sem data';
  if (s === today()) return 'hoje';
  if (s === iso(addDays(new Date(),1))) return 'amanhã';
  if (s === iso(addDays(new Date(),-1))) return 'ontem';
  const d = fromIso(s); return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;
}
const relPrep = s => { const r = rel(s); return (r==='hoje'||r==='amanhã'||r==='ontem') ? r : `em ${r}`; };
function parseMoneyInput(v){
  v = String(v||'').replace(/[^\d.,]/g,''); if (!v) return 0;
  if (v.includes(',')) v = v.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g,'');
  return Math.round(parseFloat(v)*100) || 0;
}
const ADV = {0:'no horário',5:'5 min antes',15:'15 min antes',30:'30 min antes',60:'1 hora antes'};
const PRI = {alta:'Alta',media:'Média',baixa:'Baixa'};
const PRIO_N = {alta:0,media:1,baixa:2};

/* ---------- dados (Supabase) ---------- */
const SB_URL = 'https://tgrfwgzfjrwgkkvpgbqq.supabase.co';
// chave pública (anon): pode ficar no navegador; quem protege os dados de cada usuário é o RLS do banco
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRncmZ3Z3pmanJ3Z2trdnBnYnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2OTMxMDYsImV4cCI6MjExMDI2OTEwNn0.O2xXMY9NAQSeuxYmbOvT20u9UXaFp9Fr73W2HMcju4Q';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const CATS = {lembrete:'Novo lembrete',compromisso:'Compromisso próximo',vencer:'Conta a vencer',vencida:'Conta vencida',pendente:'Tarefa pendente',concluida:'Tarefa concluída',resposta:'Resposta da IA',resumo:'Resumo diário',sair:'Hora de sair',noticia:'Notícia em destaque',prioritario:'Alerta prioritário'};
const defCats = () => Object.fromEntries(Object.keys(CATS).map(k=>[k, k !== 'noticia']));
const LOCAL = 'meudia.local';
let session = null;
const blankState = () => ({ name:'', sounds:true, quiet_start:'', quiet_end:'', event_adv:30, summary_time:'07:30', home:{addr:''}, work:{addr:''}, travel_on:true, travel_arrive:30, cats:defCats(), example:false, fired:{}, chat:[], chatLoaded:false, events:[], tasks:[], fin:[], rems:[] });
let S = blankState();
try { S.fired = (JSON.parse(localStorage.getItem(LOCAL)) || {}).fired || {}; } catch(e) {}

const MAP = {
  ev:   { table:'events',
          to: r => ({id:r.id, title:r.title, date:r.date, time:tm(r.start_time), end:tm(r.end_time), place:r.place||'', cat:r.category, done:r.done,
                from:r.travel_from||'auto', plat:r.place_lat ?? null, plon:r.place_lon ?? null, plabel:r.place_label||'', tmin:r.travel_min ?? null, leave:r.leave_at||null, torig:r.travel_origin||'', tsrc:r.travel_source||''}),
          from: o => ({title:o.title, date:o.date, start_time:o.time, end_time:o.end || null, place:o.place || '', category:o.cat || 'pessoal', done:!!o.done, travel_from:o.from || 'auto', ...(o.pgeoSet ? { place_geo:o.place, place_lat:o.plat, place_lon:o.plon, place_label:o.plabel } : {})}) },
  task: { table:'tasks',
          to: r => ({id:r.id, title:r.title, due:r.due_date || '', pri:r.priority, cat:r.category, done:r.done}),
          from: o => ({title:o.title, due_date:o.due || null, priority:o.pri || 'media', category:o.cat || 'pessoal', done:!!o.done, done_at:o.done ? new Date().toISOString() : null}) },
  fin:  { table:'finance_entries',
          to: r => ({id:r.id, type:r.kind, title:r.title, cents:Number(r.amount_cents), date:r.date, paid:r.paid}),

          to: r => ({id:r.id, title:r.title, date:r.date, time:tm(r.time), adv:r.advance_min, done:r.done}),
          from: o => ({title:o.title, date:o.date, time:o.time, advance_min:Number(o.adv) || 0, done:!!o.done}) },
};
async function loadAll(){
  const [p, ev, tk, fn, rm] = await Promise.all([
    sb.from('profiles').select('name,sounds,sound_cats,quiet_start,quiet_end,event_advance_min,summary_time,home_addr,home_lat,home_lon,work_addr,work_lat,work_lon,travel_on,travel_arrive_min,plan').maybeSingle(),
    sb.from('events').select('*').order('date'),
    sb.from('tasks').select('*'),
    sb.from('finance_entries').select('*').order('date'),
    sb.from('reminders').select('*').order('date'),
  ]);
  const bad = [p, ev, tk, fn, rm].find(r => r.error); if (bad) throw bad.error;
  if (p.data){
    S.name = p.data.name || ''; S.sounds = p.data.sounds; S.cats = Object.assign(defCats(), p.data.sound_cats || {});
    S.quiet_start = tm(p.data.quiet_start); S.quiet_end = tm(p.data.quiet_end); S.event_adv = p.data.event_advance_min ?? 30; S.summary_time = tm(p.data.summary_time) || '07:30';
    S.home = { addr:p.data.home_addr || '', lat:p.data.home_lat, lon:p.data.home_lon }; S.work = { addr:p.data.work_addr || '', lat:p.data.work_lat, lon:p.data.work_lon };
    S.travel_on = p.data.travel_on !== false; S.travel_arrive = p.data.travel_arrive_min || 30; S.plan = p.data.plan || 'free';
  }
  S.events = ev.data.map(MAP.ev.to); S.tasks = tk.data.map(MAP.task.to); S.fin = fn.data.map(MAP.fin.to); S.rems = rm.data.map(MAP.rem.to);
}
async function dbSave(k, o, isNew){
  const m = MAP[k];
  if (isNew){ const { data, error } = await sb.from(m.table).insert(m.from(o)).select().single(); if (error) throw error; return m.to(data); }
  const { error } = await sb.from(m.table).update(m.from(o)).eq('id', o.id); if (error) throw error; return o;
}
async function dbDel(k, id){ const { error } = await sb.from(MAP[k].table).delete().eq('id', id); if (error) throw error; }
function fail(e){ console.error(e); toast('Não foi possível salvar. Confira sua conexão e tente de novo.'); loadAll().then(render).catch(()=>{}); }
const persist = p => Promise.resolve(p).catch(fail);
let profT;
function saveProfile(){
  clearTimeout(profT);
  profT = setTimeout(() => persist(sb.from('profiles').update({ name:S.name, sounds:S.sounds, sound_cats:S.cats, quiet_start:S.quiet_start || null, quiet_end:S.quiet_end || null, event_advance_min:Number(S.event_adv) || 0, summary_time:S.summary_time || '07:30', travel_on:!!S.travel_on, travel_arrive_min:Number(S.travel_arrive) || 30 }).eq('id', session.user.id).then(r => { if (r.error) throw r.error; })), 500);
}

const TONES = {
  lembrete:[[880,0],[1318,.12]], compromisso:[[659,0],[880,.13],[988,.26]], vencer:[[523,0],[659,.15]],
  vencida:[[440,0],[349,.2]], pendente:[[740,0],[740,.16]], concluida:[[784,0],[1047,.1]],
  resposta:[[1175,0]], resumo:[[523,0],[659,.12],[784,.24],[1047,.36]], prioritario:[[988,0],[988,.17],[988,.34]], sair:[[587,0],[784,.12],[988,.24],[784,.36]], noticia:[[698,0],[880,.14]],
};
let actx = null;
function play(cat, force){
  if (!force && (!S.sounds || !S.cats[cat])) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const now = actx.currentTime + .02;
    TONES[cat].forEach(([f,t]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now+t); g.gain.linearRampToValueAtTime(.16, now+t+.015);
      g.gain.exponentialRampToValueAtTime(.0001, now+t+.5);
      o.connect(g).connect(actx.destination); o.start(now+t); o.stop(now+t+.55);
    });
  } catch(e) {}
}

/* ---------- alarme "Saia já": som alto e insistente ---------- */
// sirene de dois tons gerada no aparelho (onda quadrada: soa mais alto). Toca por <audio>, que no iPhone
// ignora a chave de silencioso enquanto o app está aberto.
let alarmEl = null, alarmReady = false, alarmUrl = null, alarmVib = null, alarmStopT = null;
function sirenUrl(){
  if (alarmUrl) return alarmUrl;
  const sr = 22050, n = sr * 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0,'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36,'data'); v.setUint32(40, n * 2, true);
  let ph = 0;
  for (let i = 0; i < n; i++){
    const t = i / sr, k = t % 0.25, f = Math.floor(t / 0.25) % 2 ? 1450 : 960;
    ph += 2 * Math.PI * f / sr;
    const env = k < 0.01 ? k / 0.01 : k > 0.22 ? 0 : 1;
    v.setInt16(44 + i * 2, Math.sign(Math.sin(ph)) * env * 31000, true);
  }
  return alarmUrl = URL.createObjectURL(new Blob([buf], { type:'audio/wav' }));
}
// o celular só libera o som depois de um toque na tela: preparo no primeiro toque
function unlockAlarm(){
  if (alarmReady) return;
  try {
    alarmEl = alarmEl || Object.assign(new Audio(sirenUrl()), { loop:true, preload:'auto' });
    alarmEl.muted = true;
    alarmEl.play().then(() => { if (!alarmEl.dataset.on){ alarmEl.pause(); alarmEl.currentTime = 0; } alarmEl.muted = false; alarmReady = true; }).catch(() => { alarmEl.muted = false; });
  } catch(e) {}
}
document.addEventListener('pointerdown', unlockAlarm, true);
const alarmAck = () => { try { return JSON.parse(localStorage.getItem('meudia.alarm') || '{}'); } catch(e) { return {}; } };
function alarmStop(e){
  if (e){ const a = alarmAck(); a[e.id] = e.leave; try { localStorage.setItem('meudia.alarm', JSON.stringify(a)); } catch(x) {} }
  if (alarmEl){ delete alarmEl.dataset.on; alarmEl.pause(); alarmEl.currentTime = 0; }
  clearInterval(alarmVib); clearTimeout(alarmStopT); if (navigator.vibrate) navigator.vibrate(0);
  const el = $('#alarm'); if (el){ el.hidden = true; el.innerHTML = ''; }
}
function alarmFire(e, test){
  let el = $('#alarm');
  if (!el){ el = document.createElement('div'); el.id = 'alarm'; el.setAttribute('role', 'alertdialog'); el.setAttribute('aria-label', 'Hora de sair'); document.body.appendChild(el); }
  const arrive = e ? `${e.time}` : '';
  el.innerHTML = `<div class="al-ic">${ic('nav')}</div><div class="al-big">Saia já!</div>
    ${e ? `<div class="al-t">${esc(e.title)}</div><div class="al-s">${e.tmin ? `${e.tmin} min de viagem até ${esc(e.plabel || e.place)}. ` : ''}Começa às ${arrive}.</div>` : '<div class="al-s">Teste do alarme. É assim que ele toca na hora de sair.</div>'}
    <div class="al-go">${e ? `<a class="al-waze" href="${wazeUrl(e)}" target="_blank" rel="noopener" data-al="waze">${ic('nav')}Abrir no Waze</a>` : ''}
      <button class="al-stop" data-al="stop">Parar alarme</button></div>`;
  el.hidden = false;
  el.querySelectorAll('[data-al]').forEach(b => b.onclick = () => alarmStop(test ? null : e));
  try {
    alarmEl = alarmEl || Object.assign(new Audio(sirenUrl()), { loop:true, preload:'auto' });
    alarmEl.dataset.on = '1'; alarmEl.muted = false; alarmEl.volume = 1; alarmEl.currentTime = 0;
    alarmEl.play().catch(() => play('sair', true));
  } catch(x) { play('sair', true); }
  if (navigator.vibrate){ navigator.vibrate([700, 250, 700, 250, 700]); clearInterval(alarmVib); alarmVib = setInterval(() => navigator.vibrate([700, 250, 700, 250, 700]), 3000); }
  clearTimeout(alarmStopT); alarmStopT = setTimeout(() => alarmStop(null), test ? 6000 : 3 * 60e3); // não toca para sempre
}
// confere a cada 15 s se chegou a hora exata de sair de algum compromisso
function alarmCheck(){
  if (!session || !S.travel_on || ($('#alarm') && !$('#alarm').hidden)) return;
  const now = Date.now(), ack = alarmAck();
  const e = S.events.find(x => hasLeave(x) && ack[x.id] !== x.leave && new Date(x.leave).getTime() <= now && new Date(x.leave).getTime() > now - 10 * 60e3
    && new Date(`${x.date}T${x.time}`).getTime() > now);
  if (e) alarmFire(e);
}
setInterval(alarmCheck, 15e3);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') alarmCheck(); });

function donut(parts){
  const tot = parts.reduce((a,p)=>a+p.v,0), r = 27, C = 2*Math.PI*r; let off = 0;
  const segs = tot ? parts.filter(p=>p.v).map(p => { const len = C*p.v/tot, gap = parts.filter(q=>q.v).length>1 ? 3 : 0;
    const s = `<circle cx="36" cy="36" r="${r}" fill="none" stroke="${p.c}" stroke-width="11" stroke-dasharray="${Math.max(len-gap,.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 36 36)"/>`; off += len; return s; }).join('') : '';
  return `<svg viewBox="0 0 72 72" width="72" height="72" aria-hidden="true" style="flex:none"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--fill)" stroke-width="11"/>${segs}</svg>`;
}

function weekStart(d){ const x = new Date(d); x.setDate(x.getDate() - (x.getDay()+6)%7); x.setHours(0,0,0,0); return x; }
const hasItems = s => S.events.some(e=>e.date===s) || S.rems.some(r=>r.date===s && !r.done) || S.tasks.some(x=>x.due===s && !x.done);

function vAgenda(){

  <section>
    <div class="sh">${rel(sel).replace(/^./,c=>c.toUpperCase())}</div>

  </section>`;
}
function timeline(d){
  const isT = d===today(), now = nowHM(), nh = new Date().getHours();
  const timed = [
    ...S.events.filter(e=>e.date===d).map(e=>({k:'ev',time:e.time,ref:e,done:!!e.done})),
    ...S.rems.filter(r=>r.date===d).map(r=>({k:'rem',time:r.time,ref:r,done:r.done})),
  ].filter(i=>i.time).sort((a,b)=>a.time.localeCompare(b.time));
  const dayTasks = S.tasks.filter(x=>x.due===d);
  const same = new Set(); S.events.filter(e=>e.date===d).forEach(a => S.events.forEach(b => { if (a!==b && b.date===d && a.time===b.time) same.add(a.id); }));
  const hrs = timed.map(i=>Number(i.time.slice(0,2)));
  const from = Math.min(7, ...hrs, isT ? nh : 24), to = Math.max(20, ...hrs, isT ? nh : 0);
  const cardOf = i => { const r = i.ref;
    return `<div class="ev ${i.k==='rem'?'rem':''} ${i.done?'done':''}">
      <button class="main" data-edit="${i.k}:${r.id}"><div class="t">${esc(r.title)}</div>
        <div class="s">${i.k==='ev' ? `${r.time}${r.end?'–'+r.end:''}${r.place?' · '+esc(r.place):''}${leaveTxt(r)}` : `Lembrete · ${r.time} · avisar ${ADV[r.adv]}`}</div></button>
      ${same.has(r.id) ? '<span class="chip warn">Conflito</span>' : ''}${i.k==='ev' ? routeBtn(r) : ''}
      <button class="check2 ${i.done?'on':''}" data-toggle="${i.k}:${r.id}" aria-label="${i.done?'Reabrir':'Concluir'} ${esc(r.title)}">${i.done?ic('ok'):''}</button>
    </div>`; };
  const line = `<div class="nowline" role="img" aria-label="Agora, ${now}"></div>`;
  let out = '';
  if (dayTasks.length) out += `<div class="list" style="margin-bottom:14px">${dayTasks.map(x=>`<div class="tcard ${x.done?'done':''}"><span class="bar ${x.done?'mint':''}"></span><button class="main" data-edit="task:${x.id}"><div class="t">${esc(x.title)}</div><div class="s">Tarefa do dia · prioridade ${PRI[x.pri].toLowerCase()}</div></button><button class="check2 ${x.done?'on':''}" data-toggle="task:${x.id}" aria-label="Concluir ${esc(x.title)}">${x.done?ic('ok'):''}</button></div>`).join('')}</div>`;
  out += '<div class="tl">';
  for (let h = from; h <= to; h++){
    const its = timed.filter(i=>Number(i.time.slice(0,2))===h);
    let slot = '', placed = false;
    its.forEach(i => { if (isT && !placed && h===nh && i.time>now){ slot += line; placed = true; } slot += cardOf(i); });
    if (isT && h===nh && !placed) slot += line;
    out += `<div class="hr"><span class="hl">${pad(h)}:00</span><div class="slot">${slot}</div></div>`;
  }
  return out + '</div>';
}

    <div class="bar"><span style="min-width:70px"></span><b>Adicionar</b><button class="save" data-x>Fechar</button></div>
    <div class="body">
      <div class="group">${[['ev','cal','Compromisso'],['task','task','Tarefa'],['rem','bell','Lembrete'],['fin','fin','Conta, despesa ou receita']].map(([k,i,l])=>`<button class="row" data-k="${k}"><span class="mi">${ic(i)}</span><span class="main t">${l}</span>${ic('r','i chev')}</button>`).join('')}</div>
      <div class="group"><button class="row" data-ai><span class="mi">${ic('spark')}</span><span class="main"><div class="t">Pedir ao assistente</div><div class="s">Diga do seu jeito e ele organiza</div></span>${ic('r','i chev')}</button></div>
    </div></div>`;
  el.hidden = false;
  const close = () => { el.hidden = true; el.innerHTML = ''; };
  el.onclick = e => { if (e.target === el) close(); };
  el.querySelector('[data-x]').onclick = close;
  el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { close(); openEntity(b.dataset.k); });
  el.querySelector('[data-ai]').onclick = () => { close(); go('assistente'); setTimeout(()=>{ const i = $('#chat-in'); if (i) i.focus(); }, 60); };
}

/* ---------- Tarefas ---------- */
function vTasks(){

  const list = ui.taskSeg==='pend' ? pend : done;
  const t = today();
  return `
  ${back()}<div class="head"><div><h1 class="lt">Tarefas</h1><div class="sub">${pend.length} pendente${pend.length===1?'':'s'}</div></div>
    <button class="icon-btn" data-new="task" aria-label="Nova tarefa">${ic('plus')}</button></div>
  <div class="seg" role="group" aria-label="Filtro">
    <button data-seg="pend" aria-pressed="${ui.taskSeg==='pend'}">Pendentes</button>
    <button data-seg="done" aria-pressed="${ui.taskSeg==='done'}">Concluídas</button>
  </div>
  <div class="group">
    ${list.length ? list.map(x => `
      <div class="row ind ${x.done?'done':''}">
        <button class="check ${x.done?'on':''}" data-toggle="task:${x.id}" aria-label="${x.done?'Reabrir':'Concluir'} ${esc(x.title)}">${x.done?ic('ok'):''}</button>

}

/* ---------- Finanças ---------- */
function vFin(){
  const n = new Date(), base = new Date(n.getFullYear(), n.getMonth()+ui.finOff, 1);
  const mk = iso(base).slice(0,7), t = today();
  const m = finMonth(mk);
  const bills = S.fin.filter(f => f.type==='conta' && (monthKey(f.date)===mk || (!f.paid && f.date<t && ui.finOff===0 && monthKey(f.date)<mk)))
    .sort((a,b)=>Number(a.paid)-Number(b.paid) || a.date.localeCompare(b.date));
  const moves = S.fin.filter(f => f.type!=='conta' && monthKey(f.date)===mk).sort((a,b)=>b.date.localeCompare(a.date));
  const status = f => f.paid ? '<span class="chip good">Paga</span>' : f.date<t ? '<span class="chip bad">Vencida</span>' : f.date<=iso(addDays(n,3)) ? '<span class="chip warn">Vence logo</span>' : '<span class="chip">Pendente</span>';
  return `
  <div class="head"><div><h1 class="lt">Finanças</h1><div class="sub">Lançamentos feitos por você</div></div>
    <button class="icon-btn" data-new="fin" aria-label="Novo lançamento">${ic('plus')}</button></div>
  <div class="pager">
    <button class="icon-btn" data-month="-1" aria-label="Mês anterior">${ic('l')}</button>
    <span class="lbl">${MONL[base.getMonth()]} ${base.getFullYear()}</span>
    <button class="icon-btn" data-month="1" aria-label="Próximo mês">${ic('r')}</button>
  </div>
  <div class="sum">
    <div><div class="k">Receitas</div><div class="v">${acc(m.rec,'pos')}</div></div>
    <div><div class="k">Despesas</div><div class="v">${acc(m.desp,'neg')}</div></div>
    <div><div class="k">Saldo</div><div class="v">${acc(m.saldo, m.saldo<0?'neg':'')}</div></div>
  </div>
  <section>
    <div class="sh">Contas a pagar</div>
    <div class="group">
      ${bills.length ? bills.map(f => `
        <div class="row">
          <button class="main" data-edit="fin:${f.id}" style="text-align:left">
            <div class="t">${esc(f.title)}</div>
            <div class="s" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${status(f)} <span>vence ${rel(f.date)}</span></div>
          </button>
          <span class="right">${acc(f.cents)}${f.paid ? '' : `<button class="pay" data-pay="${f.id}">Pagar</button>`}</span>
        </div>`).join('') : `<div class="empty">Nenhuma conta neste mês.</div>`}
    </div>
  </section>
  <section>
    <div class="sh">Despesas e receitas</div>
    <div class="group">
      ${moves.length ? moves.map(f => `
        <button class="row" data-edit="fin:${f.id}">
          <span class="main"><div class="t">${esc(f.title)}</div><div class="s">${f.type==='receita'?'Receita':'Despesa'} · ${rel(f.date)}</div></span>
          ${acc(f.cents, f.type==='receita'?'pos':'')}
        </button>`).join('') : `<div class="empty">Sem lançamentos neste mês.</div>`}
    </div>
    <div class="foot">Valores em reais (R$). Saldo = receitas menos despesas e contas pagas no mês.</div>
  </section>`;
}

/* ---------- Lembretes ---------- */
function vRems(){
  const t = today();
  const open = S.rems.filter(r=>!r.done).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const groups = [['Hoje', open.filter(r=>r.date===t)], ['Próximos', open.filter(r=>r.date>t)], ['Atrasados', open.filter(r=>r.date<t)], ['Concluídos', S.rems.filter(r=>r.done).slice(-8).reverse()]];
  const row = r => `
    <div class="row ind ${r.done?'done':''}">
      <button class="check ${r.done?'on':''}" data-toggle="rem:${r.id}" aria-label="${r.done?'Reabrir':'Concluir'} ${esc(r.title)}">${r.done?ic('ok'):''}</button>
      <button class="main" data-edit="rem:${r.id}" style="text-align:left">
        <div class="t">${esc(r.title)}</div>
        <div class="s">${rel(r.date).replace(/^./,c=>c.toUpperCase())} às ${r.time} · avisar ${ADV[r.adv]}</div>
      </button>
    </div>`;
  return `
  ${back()}<div class="head"><div><h1 class="lt">Lembretes</h1><div class="sub">${pushState()==='ativo' ? 'Alerta no celular, mesmo com o app fechado' : 'Ative os alertas em Ajustes para receber com o app fechado'}</div></div>
    <button class="icon-btn" data-new="rem" aria-label="Novo lembrete">${ic('plus')}</button></div>
  ${groups.filter(([,l])=>l.length).map(([h,l]) => `<section><div class="sh">${h}</div><div class="group">${l.map(row).join('')}</div></section>`).join('') || `<div class="group"><div class="empty">Nenhum lembrete. Diga ao assistente: “me lembre de pagar a escola amanhã às 10h”.</div></div>`}`;
}

/* ---------- eventos da tela ---------- */
function bindView(){
  const V = $('#view');
  V.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  V.querySelectorAll('[data-say]').forEach(b => b.onclick = () => send(b.dataset.say));
  V.querySelectorAll('[data-new]').forEach(b => b.onclick = () => openEntity(b.dataset.new));
  V.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const [k,id] = b.dataset.edit.split(':'); openEntity(k, id); });
  V.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const [k,id] = b.dataset.toggle.split(':'); const it = S[ARR[k]].find(x=>x.id===id); if (!it) return;
    it.done = !it.done; if (it.done) play('concluida'); render(); persist(dbSave(k, it, false));
  });
  V.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
    const f = S.fin.find(x=>x.id===b.dataset.pay); f.paid = true; play('concluida'); render(); persist(dbSave('fin', f, false));
    toast(`<b>${esc(f.title)}</b> marcada como paga`);
  });
  V.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { ui.filter = b.dataset.filter; render(); });
  V.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    ui.calMode = ui.calMode==='semana' ? 'mes' : 'semana';
    const s = fromIso(ui.agendaSel), n = new Date();
    ui.monthOff = (s.getFullYear()-n.getFullYear())*12 + s.getMonth()-n.getMonth();
    ui.weekOff = Math.round((weekStart(s) - weekStart(n)) / 6048e5); render(); });
  V.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    const k = Number(b.dataset.cal);
    if (ui.calMode==='semana'){ ui.weekOff += k; ui.agendaSel = iso(addDays(fromIso(ui.agendaSel), 7*k)); }
    else { ui.monthOff += k; const n = new Date(); ui.agendaSel = iso(new Date(n.getFullYear(), n.getMonth()+ui.monthOff, 1)); }
    render(); });
  V.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    ui.agendaSel = b.dataset.pick; const s = fromIso(ui.agendaSel), n = new Date();
    ui.weekOff = Math.round((weekStart(s) - weekStart(n)) / 6048e5);
    ui.monthOff = (s.getFullYear()-n.getFullYear())*12 + s.getMonth()-n.getMonth(); render(); });
  V.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { ui.agendaSel = b.dataset.day; render(); });
  V.querySelectorAll('[data-week]').forEach(b => b.onclick = () => {
    ui.weekOff += Number(b.dataset.week); ui.agendaSel = iso(addDays(weekStart(new Date()), ui.weekOff*7 + (ui.weekOff===0 ? (new Date().getDay()+6)%7 : 0))); render();
  });
  V.querySelectorAll('[data-month]').forEach(b => b.onclick = () => { ui.finOff += Number(b.dataset.month); render(); });
  V.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => { ui.taskSeg = b.dataset.seg; render(); });
  V.querySelectorAll('[data-test]').forEach(b => b.onclick = () => play(b.dataset.test, true));
  V.querySelectorAll('[data-cat]').forEach(c => c.onchange = () => { S.cats[c.dataset.cat] = c.checked; saveProfile(); });
  V.querySelectorAll('[data-mic]').forEach(b => b.onclick = micNote);
  V.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a==='logout'){ unsubscribePush().finally(() => sb.auth.signOut()); }
    if (a==='push-on'){ enablePush(); }
    if (a==='wx-on'){ loadWeather(true); }
    if (a==='frete-edit'){ openFreteEdit(); }
    if (a==='news-eco'){ ui.newsTab = 'economia'; ui.newsPage = 0; go('noticias'); }
    if (a==='mkt-refresh'){ loadMarket(true); }
    if (a==='wx-pick'){ openWxPicker(); }
    if (a==='wx-refresh'){ wxFull = null; wxFullState = 'idle'; try { localStorage.removeItem('meudia.wxfull'); } catch(e) {} loadWeatherFull(true); render(); }
    if (a==='fam-create'){ famCall('family_create', { p_name: 'Família ' + ((S.name||'').split(' ').slice(-1)[0] || '') }, 'Família criada. Agora convide as pessoas.'); }
    if (a==='fam-code'){ openJoin(''); }
    if (a==='fam-invite'){ famCall('family_invite').then(code => { if (code) shareInvite(code); }); }
    if (a==='fam-leave' || a==='fam-dissolve'){
      const k = a==='fam-leave' ? 'famLeave' : 'famDissolve';
      if (!ui[k]){ ui[k] = true; render(); setTimeout(()=>{ ui[k]=false; if(view==='ajustes') render(); }, 4000); return; }
      ui[k] = false; famCall(a==='fam-leave' ? 'family_leave' : 'family_dissolve', {}, a==='fam-leave' ? 'Você saiu da família' : 'Família desfeita');
    }
    if (a==='admin-refresh'){ adminData = null; adminErr = ''; render(); }
    if (a==='admin-budget' && adminData){ openBudget(); }
    if (a==='push-test'){ testPush(); }
    if (a==='push-later'){ try { localStorage.setItem('meudia.pushlater', String(Date.now())); } catch(e) {} render(); }
    if (a==='today'){ ui.weekOff = 0; ui.monthOff = 0; ui.agendaSel = today(); render(); }
    if (a==='clear-chat'){ S.chat = []; S.chatLoaded = true; render(); persist(sb.from('conversations').delete().not('id','is',null).then(r => { if (r.error) throw r.error; })); }
    if (a==='wipe'){
      if (!ui.wipe){ ui.wipe = true; render(); setTimeout(()=>{ ui.wipe=false; if(view==='ajustes') render(); }, 4000); return; }
      ui.wipe = false;
      Promise.all(['reminders','events','tasks','finance_entries','conversations','memories'].map(t => sb.from(t).delete().not('id','is',null)))
        .then(rs => { const bad = rs.find(r => r.error); if (bad) throw bad.error; S.events = []; S.tasks = []; S.fin = []; S.rems = []; S.chat = []; render(); toast('Todos os dados foram apagados'); })
        .catch(fail);
    }
  });
  V.querySelectorAll('[data-famshare]').forEach(b => b.onclick = () => shareInvite(b.dataset.famshare));
  V.querySelectorAll('[data-famcancel]').forEach(b => b.onclick = () => famCall('family_cancel_invite', { p_code: b.dataset.famcancel }, 'Convite cancelado'));
  V.querySelectorAll('[data-famrm]').forEach(b => b.onclick = () => {
    if (!b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'Confirmar'; return; }
    famCall('family_remove', { p_user: b.dataset.famrm }, `${esc(b.dataset.famname)} saiu da família`);
  });
  V.querySelectorAll('[data-route]').forEach(b => b.onclick = ev => { ev.stopPropagation(); openRoute(b.dataset.route); });
  V.querySelectorAll('[data-addr]').forEach(b => b.onclick = () => openAddr(b.dataset.addr));
  V.querySelectorAll('[data-newsopen]').forEach(a => a.addEventListener('click', () => { markNewsSeen(a.dataset.newsopen); setTimeout(render, 300); }));
  V.querySelectorAll('[data-ind]').forEach(b => b.onclick = ev => { ev.stopPropagation(); if (b.dataset.ind.startsWith('FRETE:')){ ui.port = b.dataset.ind.slice(6); const fr = fretePort(ui.port); openFrete(fr && fr.c40 ? 'c40' : 'c40hc'); } else openInfo(b.dataset.ind); });
  V.querySelectorAll('[data-port]').forEach(b => b.onclick = () => { ui.port = b.dataset.port; render(); });
  V.querySelectorAll('[data-frete]').forEach(b => b.onclick = () => openFrete(b.dataset.frete));
  V.querySelectorAll('[data-bolsatab]').forEach(b => b.onclick = () => { ui.bolsaTab = b.dataset.bolsatab; render(); });
  V.querySelectorAll('[data-newstab]').forEach(b => b.onclick = () => { ui.newsTab = b.dataset.newstab; ui.newsPage = 0; render(); });
  V.querySelectorAll('[data-newspage]').forEach(b => b.onclick = () => { ui.newsPage = (ui.newsPage || 0) + Number(b.dataset.newspage); render(); });
  V.querySelectorAll('[data-wxtab]').forEach(b => b.onclick = () => { ui.wxTab = b.dataset.wxtab; ui.wxPage = 0; render(); });
  V.querySelectorAll('[data-wxpage]').forEach(b => b.onclick = () => { ui.wxPage = (ui.wxPage || 0) + Number(b.dataset.wxpage); render(); });
  ['th-mode','th-dark','th-light'].forEach(id => { const el = $('#'+id); if (el) el.onchange = () => {
    const c = themeCfg(); c[{ 'th-mode':'mode', 'th-dark':'dark', 'th-light':'light' }[id]] = el.value;
    try { localStorage.setItem('meudia.theme', JSON.stringify(c)); } catch(e) {} applyTheme(); render(); }; });
  const at = $('#alarm-test'); if (at) at.onclick = () => alarmFire(null, true);
  const st = $('#set-travel'); if (st) st.onchange = () => { S.travel_on = st.checked; saveProfile(); };
  const pa = $('#pref-arr'); if (pa) pa.onchange = () => { S.travel_arrive = Number(pa.value); saveProfile(); S.events.forEach(e => { if (e.date >= today() && e.place){ e.tsrc = ''; e.leave = null; } }); persist(sb.from('events').update({ travel_checked_at: null }).gte('date', today()).neq('place', '').then(r => { if (r.error) throw r.error; })); };
  const nm = $('#set-name'); if (nm) nm.oninput = () => { S.name = nameCase(nm.value); saveProfile(); };
  V.querySelectorAll('[data-auser]').forEach(b => b.onclick = () => openUserPlan(b.dataset.auser));
  V.querySelectorAll('[data-apage]').forEach(b => b.onclick = () => { adminPage += Number(b.dataset.apage); render(); $('#view').scrollTop = 0; });
  V.querySelectorAll('[data-pref]').forEach(inp => inp.onchange = () => { S[inp.dataset.pref] = inp.value; saveProfile(); toast('Preferência salva'); });
  const snd = $('#set-sounds'); if (snd) snd.onchange = () => { S.sounds = snd.checked; saveProfile(); };
  const ask = $('#ask'); if (ask) ask.onsubmit = e => { e.preventDefault(); const v = $('#ask-in').value; if (!v.trim()) return; send(v); };

/* ---------- ditado por voz (reconhecimento de fala do próprio aparelho) ---------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function micNote(e){ startDictation(e.currentTarget); }
function startDictation(btn){
  const form = btn.closest('form'), input = form && form.querySelector('input');
  if (!input) return;
  if (!SpeechRec){ toast('Aqui o ditado direto não está disponível. Toque no campo e use o microfone do teclado do celular.'); input.focus(); return; }
  if (rec){ rec.stop(); return; }
  const ph = input.placeholder; let finalText = '', failed = false;
  rec = new SpeechRec(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  btn.classList.add('rec'); btn.setAttribute('aria-label', 'Parar de ouvir'); input.placeholder = 'Ouvindo… pode falar';
  rec.onresult = ev => {
    let t = ''; for (const r of ev.results) t += r[0].transcript;
    input.value = t; if (ev.results[ev.results.length - 1].isFinal) finalText = t;
  };
  rec.onerror = ev => {
    failed = true;
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast('Para ditar, permita o uso do microfone. Se não aparecer o pedido, use o microfone do teclado.');
    else if (ev.error === 'no-speech') toast('Não ouvi nada. Toque no microfone e fale de novo.');
    else if (ev.error !== 'aborted') toast('Não consegui ouvir. Tente de novo ou use o microfone do teclado.');
  };
  rec.onend = () => {
    btn.classList.remove('rec'); btn.setAttribute('aria-label', 'Falar'); input.placeholder = ph; rec = null;
    const t = (finalText || input.value).trim();
    if (t && !failed){ input.value = ''; send(t); }
  };
  try { rec.start(); } catch(err) { rec = null; btn.classList.remove('rec'); input.placeholder = ph; toast('Não consegui abrir o microfone. Use o microfone do teclado.'); }
}

  el.querySelectorAll('input[data-money]').forEach(inp => {
    let fresh = true;
    const put = c => { inp.dataset.cents = c; inp.value = c ? 'R$ ' + brl(c) : ''; };
    inp.addEventListener('focus', () => { fresh = true; setTimeout(() => inp.setSelectionRange(inp.value.length, inp.value.length), 0); });
    inp.addEventListener('beforeinput', e => {
      e.preventDefault();
      let c = fresh ? 0 : Number(inp.dataset.cents) || 0; fresh = false;

function openEntity(k, id){

      if (k==='fin' && !it) v.paid = v.type!=='conta';
      if (!it) v.done = false;
      let synced = '';
      if (it) { const prev = {...it}; Object.assign(it, v); try { await dbSave(k, it, false); } catch(e) { Object.assign(it, prev); throw e; } if (k==='rem') delete S.fired[it.id];
        // lembrete e compromisso com o mesmo nome, no mesmo dia e hora: mudar um muda o outro
        if ((k==='rem' || k==='ev') && (prev.date !== it.date || prev.time !== it.time)){
          const norm = t => String(t || '').trim().toLocaleLowerCase('pt-BR');
          const twin = (k==='rem' ? S.events : S.rems).find(x => norm(x.title) === norm(prev.title) && x.date === prev.date && x.time === prev.time && !x.done);
          if (twin){
            const old = {...twin}; twin.date = it.date; twin.time = it.time;
            try { await dbSave(k==='rem' ? 'ev' : 'rem', twin, false); synced = k==='rem' ? ' O compromisso também mudou de horário.' : ' O lembrete também mudou de horário.';
              if (k==='rem' && twin.place){ twin.leave = null; twin.tsrc = ''; setTimeout(() => calcTravel(twin, true), 0); } }
            catch(e) { Object.assign(twin, old); }
          }
        } }
      else { const rec = await dbSave(k, v, true); arr.push(rec); play(k==='rem'?'lembrete':'resposta'); if (k==='ev') it_new = rec; }
      const evT = it || it_new; if (evT) delete evT.pgeoSet; if (k==='ev' && evT && evT.place){ if (it){ evT.leave = null; evT.tsrc = ''; } setTimeout(() => calcTravel(evT, true), 0); }

    },
    onDelete: it ? async () => { await dbDel(k, it.id); arr.splice(arr.indexOf(it),1); } : null,
  });

/* limite diário do plano grátis: "Você usou 42% do seu limite" */
const quotaGet = () => { try { const q = JSON.parse(localStorage.getItem('meudia.quota') || 'null'); return q && Date.now() - q.at < 24 * 3600e3 ? q : null; } catch(e) { return null; } };
function quotaHtml(){
  const q = quotaGet(); if (!q || !q.limit) return '<div class="quota" id="quota" hidden></div>';
  const pct = Math.min(100, Math.round(q.used / q.limit * 100));
  return `<button class="quota ${pct >= 100 ? 'full' : pct >= 75 ? 'warn' : ''}" id="quota" data-plans="limite" aria-label="Limite do plano grátis. Ver planos">
    <span class="qb" aria-hidden="true"><i style="width:${pct}%"></i></span>
    <span>Você usou ${pct}% do limite grátis · ${q.used} de ${q.limit} msg <span class="q-go">Ver planos</span></span></button>`;
}
function quotaSet(r){
  if (r.failed) return;
  const old = quotaGet();
  if (!r.quota){ try { localStorage.removeItem('meudia.quota'); } catch(e) {} }
  else {
    try { localStorage.setItem('meudia.quota', JSON.stringify({ ...r.quota, at: Date.now() })); } catch(e) {}
    const pct = Math.round(r.quota.used / r.quota.limit * 100), before = old ? Math.round(old.used / old.limit * 100) : 0;
    const mark = [100, 75, 50].find(m => pct >= m && before < m);
    if (mark >= 75) r.chips = [...(r.chips || []), { label: mark === 100 ? 'Conhecer os planos' : 'Ver planos com mais mensagens', act:'plans' }];
    if (mark === 100) toast(`Você usou 100% do limite do plano grátis (${r.quota.limit} mensagens em 24 h).`);
    else if (mark) toast(`Você usou ${pct}% do seu limite do plano grátis. Restam ${r.quota.limit - r.quota.used} mensagens.`);
  }
  const el = $('#quota'); if (el) el.outerHTML = quotaHtml();
}

    m.state = 'saving'; busy = true; typing = true; renderChat();
    const r = await callAssistant({ confirm:id, accept });
    busy = false; typing = false;
    m.state = r.failed ? 'pending' : (accept ? 'done' : 'cancelled');
    if (r.reload) { try { await loadAll(); } catch(e) {} }
    addReply(r);
  };
  box.querySelectorAll('[data-yes]').forEach(b => b.onclick = () => decide(b.dataset.yes, true));
  box.querySelectorAll('[data-no]').forEach(b => b.onclick = () => decide(b.dataset.no, false));
  box.querySelectorAll('[data-chip]').forEach(b => b.onclick = async () => {
    const [mid, i] = b.dataset.chip.split(':'); const m = S.chat.find(x => x.id === mid); const c = m.chips[Number(i)];
    if (typeof c === 'string') return send(c);
    if (c.act === 'go'){ if (c.date){ ui.agendaSel = c.date; ui.weekOff = Math.round((weekStart(fromIso(c.date)) - weekStart(new Date())) / (7 * 864e5)); const d = fromIso(c.date), n = new Date(); ui.monthOff = (d.getFullYear() - n.getFullYear()) * 12 + d.getMonth() - n.getMonth(); } go(c.view || 'agenda'); return; }       // atalhos (não somem)
    if (c.act === 'route'){ openRoute(c.ref); return; }
    if (c.act === 'plans'){ openPlans('limite'); return; }
    m.chips = null;
    const ev = S.events.find(e => e.id === c.ref);
    if (!ev){ addReply({ text:'Esse compromisso não existe mais.' }); return; }
    S.chat.push({ id:'u' + uid(), role:'user', text:c.label });
    try {
      const rec = await dbSave('rem', { title:ev.title, date:ev.date, time:ev.time, adv:c.adv, done:false }, true);
      S.rems.push(rec); play('lembrete');
      addReply({ text:`Lembrete criado. Aviso ${ADV[c.adv]} de **${ev.title}**.` });
    } catch(e) { console.error(e); addReply({ text:'Não consegui criar o lembrete. Tente de novo.' }); }
  });
  const sc = $('#msgs'); if (sc) sc.scrollTop = sc.scrollHeight;
}
async function send(text){
  text = String(text || '').trim(); if (!text || busy) return;
  if (view !== 'assistente') go('assistente');
  await ensureChat();
  S.chat.forEach(m => { if (m.state === 'pending') m.state = 'cancelled'; });
  S.chat.push({ id:'u' + uid(), role:'user', text });
  busy = true; typing = true; renderChat();
  const r = await callAssistant({ message:text });
  busy = false; typing = false;
  addReply(r);
}

async function submitAuth(e){
  e.preventDefault();
  const v = id => ($('#' + id) || {}).value || '';
  const up = t => nameCase(t);
  const first = up(v('a-first')), last = up(v('a-last')), name = `${first} ${last}`.trim();
  const email = v('a-email').trim(), password = v('a-pass');
  const show = (t, ok = false) => { authMsg = t; authOk = ok; const el = $('#a-msg'); el.textContent = t; el.className = 'auth-msg' + (ok ? ' ok' : ''); el.hidden = false; };
  if (authMode === 'criar' && !first) return show('Digite seu nome.');
  if (authMode === 'criar' && !last) return show('Digite seu sobrenome.');
  if (authMode !== 'nova' && !/^\S+@\S+\.\S+$/.test(email)) return show('Confira o e-mail digitado.');
  if (authMode !== 'esqueci' && password.length < 8) return show('Use uma senha com pelo menos 8 caracteres.');
  const btn = $('#a-go'), label = btn.textContent; btn.disabled = true; btn.textContent = 'Aguarde…';
  try {
    if (authMode === 'entrar'){
      const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error;
    } else if (authMode === 'criar'){
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ name }, emailRedirectTo: location.origin } }); if (error) throw error;
      if (!data.session) show(`Enviamos um link de confirmação para ${email}. Abra seu e-mail e toque no link para entrar.`, true);
    } else if (authMode === 'esqueci'){
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin }); if (error) throw error;
      show('Se houver uma conta com esse e-mail, enviamos um link para criar uma nova senha.', true);
    } else if (authMode === 'nova'){
      const { error } = await sb.auth.updateUser({ password }); if (error) throw error;
      recovering = false; authMode = 'entrar'; authMsg = ''; toast('Senha alterada'); startApp();
    }

function loadWeather(ask){
  if (wxState === 'loading' || !navigator.geolocation || (wxState === 'err' && !ask)) return;
  if (wx && wxState === 'ok' && !ask) return;
  let asked = false; try { asked = localStorage.getItem('meudia.wxok') === '1'; } catch(e) {}
  if (!asked && !ask){ wxState = 'off'; return; }
  wxState = 'loading';
  navigator.geolocation.getCurrentPosition(async pos => {
    try { localStorage.setItem('meudia.wxok', '1'); localStorage.setItem('meudia.wxpos', JSON.stringify({ lat: pos.coords.latitude, lon: pos.coords.longitude })); } catch(e) {}
    sb.rpc('save_location', { p_lat: pos.coords.latitude, p_lon: pos.coords.longitude }); try { localStorage.setItem('meudia.locat', String(Date.now())); } catch(e) {}
    const { data, error } = await sb.functions.invoke('clima', { body:{ lat: pos.coords.latitude, lon: pos.coords.longitude } });
    if (error || !data || data.error){ wxState = 'err'; return; }
    wx = data; wxState = 'ok';
    try { localStorage.setItem('meudia.wx', JSON.stringify({ at: Date.now(), data })); } catch(e) {}
    if (view === 'inicio') render();
  }, () => { wxState = 'off'; try { localStorage.removeItem('meudia.wxok'); } catch(e) {} if (ask) toast('Sem permissão de localização, a previsão não aparece.'); if (view === 'inicio') render(); },

}

const wxKey = () => wxPlace ? `${wxPlace.lat},${wxPlace.lon}` : 'aqui';
{ const c = lsGet('meudia.wxfull', null); if (c && c.key === wxKey() && Date.now() - c.at < 30 * 60e3) wxFull = c.data; }
const wxPos = () => { try { return JSON.parse(localStorage.getItem('meudia.wxpos') || 'null'); } catch(e) { return null; } };
function loadWeatherFull(force){
  if (wxFullState === 'loading' || (wxFull && !force)) return;
  const run = async p => {
    const { data, error } = await sb.functions.invoke('clima', { body:{ lat:p.lat, lon:p.lon, full:true } });
    if (error || !data || data.error || !data.days){ wxFullState = 'err'; if (view === 'clima') render(); return; }
    if (wxPlace && wxPlace.name) data.city = wxPlace.name;
    wxFull = data; wxFullState = 'ok';
    lsSet('meudia.wxfull', { at: Date.now(), key: wxKey(), data });
    if (view === 'clima') render();
  };
  wxFullState = 'loading';
  if (wxPlace) return run(wxPlace);
  const p = wxPos();
  if (p) return run(p);
  if (!navigator.geolocation){ wxFullState = 'err'; return; }
  navigator.geolocation.getCurrentPosition(pos => { const q = { lat: pos.coords.latitude, lon: pos.coords.longitude }; try { localStorage.setItem('meudia.wxpos', JSON.stringify(q)); localStorage.setItem('meudia.wxok', '1'); } catch(e) {} run(q); },
    () => { wxFullState = 'err'; if (view === 'clima') render(); }, { timeout:10000, maximumAge:30 * 60e3 });
}
const DOW3 = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function dayLabel(s){ const d = fromIso(s); if (s === today()) return 'Hoje'; if (s === iso(addDays(new Date(),1))) return 'Amanhã'; return `${DOW3[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; }
function vClima(){
  if (!ui.wxTab) ui.wxTab = 'hoje';
  const tz = (wxPlace && wxPlace.tz) || (wxFull && wxFull.tz) || '';
  let localNow = '';
  try { if (tz) localNow = new Date().toLocaleTimeString('pt-BR', { timeZone: tz, hour: '2-digit', minute: '2-digit' }); } catch(e) {}
  const myTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const head = `${back()}<div class="head"><div><h1 class="lt">Previsão do tempo</h1>
      <button class="wx-place" data-act="wx-pick">${ic('pin')}<span>${wxFull && wxFull.city ? esc(wxFull.city) : wxPlace ? esc(wxPlace.name) : 'Onde você está'}</span>${ic('down')}</button>
      ${localNow ? `<div class="sub">${tz !== myTz ? 'Horário local lá' : 'Agora'}: ${localNow}${tz !== myTz ? ` · aqui ${nowHM()}` : ''}</div>` : ''}</div>
    <button class="icon-btn" data-act="wx-refresh" aria-label="Atualizar">${ic('refresh')}</button></div>`;
  if (!wxFull){
    loadWeatherFull();
    return head + `<div class="card empty">${wxFullState === 'err' ? 'Não foi possível carregar a previsão. Confira se a localização está liberada e toque em atualizar.' : 'Carregando…'}</div>`;
  }
  const w = wxFull, days = w.days || [], hours = w.hours || [];
  const tab = ui.wxTab, per = 8;
  let list = '';
  if (tab === 'hoje'){
    const pages = Math.max(1, Math.ceil(hours.length / per)); ui.wxPage = Math.min(Math.max(ui.wxPage || 0, 0), pages - 1);
    const rows = hours.slice(ui.wxPage * per, ui.wxPage * per + per);
    list = `<div class="group">${rows.map(h => `<div class="row wx-row"><span class="wx-t">${esc(h.t)}</span>${wxIcon(h.cond, !h.is_day)}<span class="wx-rain">${h.rain}%</span><b class="wx-temp">${h.temp}°C</b></div>`).join('')}</div>
      ${pages > 1 ? `<div class="pager" style="margin-top:10px"><button class="icon-btn" data-wxpage="-1" aria-label="Horas anteriores" ${ui.wxPage === 0 ? 'disabled' : ''}>${ic('l')}</button><span class="lbl" style="text-transform:none">${esc(rows[0].t)} às ${esc(rows[rows.length-1].t)}</span><button class="icon-btn" data-wxpage="1" aria-label="Próximas horas" ${ui.wxPage >= pages - 1 ? 'disabled' : ''}>${ic('r')}</button></div>` : ''}`;
  } else {
    const sel = tab === '7' ? days.slice(0, 7) : days.slice(7, 15);
    if (!sel.length) list = `<div class="card empty">A fonte atual mostra só ${days.length} dias.</div>`;
    else {
      const lo = Math.min(...sel.map(d => d.min)), hi = Math.max(...sel.map(d => d.max)), span = Math.max(hi - lo, 1);
      list = `<div class="group">${sel.map(d => `<div class="row wx-row"><span class="wx-d">${dayLabel(d.date)}</span>${wxIcon(d.cond)}<span class="wx-rain">${d.rain}%</span>
        <span class="wx-range"><span class="wx-min">${d.min}°</span><span class="wx-bar"><span style="left:${(d.min - lo) / span * 100}%;right:${(hi - d.max) / span * 100}%"></span></span><span class="wx-max">${d.max}°</span></span></div>`).join('')}</div>`;
    }
  }
  return `${head}
  <div class="card wx-now">${wxIcon(w.cond, !w.is_day)}<div class="wx-main"><b>${w.temp}°C</b><span>${esc(w.desc)}</span></div>
    <div class="wx-side"><span>sensação ${w.feels}°C</span>${w.humidity != null ? `<span>umidade ${w.humidity}%</span>` : ''}${w.wind != null ? `<span>vento ${w.wind} km/h</span>` : ''}</div></div>
  <div class="seg" role="group" aria-label="Período">${[['hoje','Hoje'],['7','7 dias'],['15','15 dias']].map(([k,l]) => `<button data-wxtab="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}</div>
  <section>${list}<div class="foot">${tab === 'hoje' ? 'Hora, chance de chuva (%) e temperatura (°C).' : tab === '15' ? 'Dias 8 a 15: quanto mais distante, menos precisa é a previsão.' : 'Chance de chuva (%), mínima e máxima (°C).'} Dados: ${esc(w.source)}</div></section>`;
}

  wxPlace = pl; lsSet('meudia.wxplace', pl);
  if (pl){ const list = lsGet('meudia.wxplaces', []).filter(x => x.name !== pl.name); list.unshift(pl); lsSet('meudia.wxplaces', list.slice(0, 6)); }
  wxFull = null; wxFullState = 'idle'; ui.wxPage = 0; loadWeatherFull(true); render();
}

      ${results ? results.map((r, i) => `<button class="row" data-wxr="${i}"><span class="main"><div class="t">${esc(r.name)}</div><div class="s">${esc(r.detail)}</div></span></button>`).join('') || `<div class="empty">${msg || 'Nada encontrado.'}</div>`

    t = setTimeout(async () => { const { data } = await sb.functions.invoke('clima', { body:{ action:'search', q:v } }); if (my !== seq) return; draw((data && data.results) || [], 'Nenhuma cidade encontrada.'); }, 400); };

/* ---------- hora de sair (deslocamento até o compromisso) ---------- */
const hm = iso2 => { const d = new Date(iso2); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const ORIG = { casa:'de casa', trabalho:'do trabalho', atual:'de onde você está' };
const hasLeave = e => e && e.leave && e.date >= today() && !e.done;
const leaveTxt = e => hasLeave(e) ? ` · <span class="leave">sair ${hm(e.leave)}</span>` : '';
const routeBtn = e => e.place ? `<button class="route-btn" data-route="${e.id}" aria-label="Como chegar em ${esc(e.place)}">${ic('nav')}</button>` : '';
const wazeUrl = e => e.plat != null ? `https://waze.com/ul?ll=${e.plat},${e.plon}&navigate=yes` : `https://waze.com/ul?q=${encodeURIComponent(e.place)}&navigate=yes`;
const gmapsUrl = e => `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${e.plat != null ? `${e.plat},${e.plon}` : encodeURIComponent(e.place)}`;
function applyTravel(e, r){
  if (!r) return;
  e.plat = r.place_lat ?? null; e.plon = r.place_lon ?? null; e.plabel = r.place_label || '';
  e.tmin = r.travel_min ?? null; e.leave = r.leave_at || null; e.torig = r.travel_origin || ''; e.tsrc = r.travel_source || '';
}
async function calcTravel(e, quiet){
  if (!e || !e.place) return;
  const { data, error } = await sb.functions.invoke('rota', { body:{ action:'calc', id:e.id } });
  if (error || !data){ if (!quiet) toast('Não foi possível calcular o trajeto agora.'); return; }
  applyTravel(e, data); render();
  const sh = $('#sheet'); if (!sh.hidden && sh.dataset.route === e.id) openRoute(e.id);
}
function openRoute(id){
  const e = S.events.find(x => x.id === id); if (!e) return;
  const el = $('#sheet');
  const when = `${rel(e.date)} às ${e.time}`;
  let info;
  if (hasLeave(e)) info = `<div class="route-big"><span>Saia às</span><b>${hm(e.leave)}</b></div>
      <div class="group">
        <div class="row"><span class="main t">Tempo de viagem</span><span class="n">${e.tmin} min</span></div>
        <div class="row"><span class="main t">Saindo</span><span class="s2">${ORIG[e.torig] || '—'}</span></div>
        <div class="row"><span class="main t">Chegada</span><span class="s2">${S.travel_arrive} min antes</span></div>
      </div>
      <div class="foot">${e.tsrc === 'tomtom' ? 'Calculado com o trânsito previsto para o horário. Recalculo perto da hora e aviso se mudar.' : 'Estimativa sem trânsito (com folga). Com a chave do serviço de rotas, passa a considerar o trânsito.'}</div>`;
  else if (e.tsrc === 'perto') info = `<div class="card empty">Você já está perto desse local.</div>`;
  else if (e.tsrc === 'sem_origem') info = `<div class="card empty">Cadastre o endereço de Casa ou Trabalho em Ajustes para eu calcular a hora de sair.</div>`;
  else if (e.tsrc === 'sem_local') info = `<div class="card empty">Não encontrei esse local no mapa. Edite o compromisso com rua, número e cidade.</div>`;
  else info = `<div class="card empty">${e.date < today() ? 'Esse compromisso já passou.' : 'Calculando o trajeto…'}</div>`;
  el.innerHTML = `<div class="pane" role="dialog" aria-modal="true" aria-label="Como chegar">
    <div class="bar"><span style="min-width:70px"></span><b>Como chegar</b><button class="save" data-x>Fechar</button></div>
    <div class="body">
      <div><div class="route-t">${esc(e.title)}</div><div class="route-s">${esc(when)} · ${esc(e.place)}</div>${e.plabel ? `<div class="route-s">No mapa: ${esc(e.plabel)}</div>` : ''}</div>
      ${e.date >= today() && !e.done ? `<div class="gps" id="gps-box"><div class="gps-h"><b>Daqui, agora</b><small>pelo GPS do celular</small></div><div class="gps-r" id="gps-r">${gpsTxt(e)}</div><button class="gps-btn" data-gps>${ic('nav')}${gpsMem[e.id] ? 'Atualizar minha localização' : 'Usar minha localização'}</button></div>` : ''}
      ${info}
      <div class="route-go">
        <a class="btn-go waze" href="${wazeUrl(e)}" target="_blank" rel="noopener">${ic('nav')}Abrir no Waze</a>
        <a class="btn-go" href="${gmapsUrl(e)}" target="_blank" rel="noopener">${ic('nav')}Abrir no Google Maps</a>
      </div>
      ${e.date >= today() ? '<button class="linkbtn" data-recalc>Recalcular agora</button>' : ''}
    </div></div>`;
  el.dataset.route = e.id; el.hidden = false;
  const close = () => { el.hidden = true; el.innerHTML = ''; delete el.dataset.route; };
  el.onclick = ev => { if (ev.target === el) close(); };
  el.querySelector('[data-x]').onclick = close;
  const rc = el.querySelector('[data-recalc]'); if (rc) rc.onclick = () => { rc.textContent = 'Calculando…'; rc.disabled = true; calcTravel(e); };
  if (!e.tsrc && e.date >= today()) calcTravel(e, true);
  const gb = el.querySelector('[data-gps]');
  if (gb){
    gb.onclick = () => gpsEta(e, true);
    // já autorizou a localização e o compromisso é hoje: calcula sozinho
    const m = gpsMem[e.id];
    if (!m || (!m.wait && Date.now() - m.at > 2 * 60e3)){
      const go = () => gpsEta(e, false);
      if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name:'geolocation' }).then(st => { if (st.state !== 'denied') go(); else { gpsMem[e.id] = { err:GPS_OFF, at:Date.now() }; const b = document.getElementById('gps-r'); if (b) b.innerHTML = gpsTxt(e); } }, go);
      else go();
    }
  }
}
/* ---------- GPS: tempo até o local saindo de onde a pessoa está agora ---------- */
const gpsMem = {};
function gpsTxt(e){
  const m = gpsMem[e.id];
  if (!m) return 'Toque no botão para eu ver exatamente onde você está e calcular a que horas você chega.';
  if (m.wait) return 'Localizando você pelo GPS…';
  if (m.err) return esc(m.err);
  const r = m.r;
  const here = r.here_label ? `<div class="gps-here">${ic('nav')}<span>Você está em <b>${esc(r.here_label)}</b></span></div>` : '';
  if (r.status === 'chegou') return here + '<span class="ok">Você já está no local.</span>';
  if (r.status !== 'ok') return 'Não encontrei o local no mapa. Edite o compromisso com rua, número e cidade.';
  const prec = m.acc ? ` · precisão de ${m.acc < 1000 ? Math.round(m.acc) + ' m' : n1(m.acc / 1000) + ' km'}` : '';
  const viagem = `${r.travel_min} min de viagem (${n1(r.km)} km)`;
  const start = new Date(r.start_at).getTime(), now = Date.now();
  let txt = here + `Saindo agora, você chega às <b>${hm(r.arrive_at)}</b>. ${viagem}.`;
  if (start < now) txt += ' O compromisso já começou.';
  else if (r.late_min > 0) txt += ` <span class="late">Chega ${r.late_min} min atrasado.</span>`;
  else if (new Date(r.leave_by).getTime() <= now + 60e3) txt += ` <span class="late">Saia já para chegar ${S.travel_arrive} min antes.</span>`;
  else if (e.date === today()) txt += ` <span class="ok">Para chegar ${S.travel_arrive} min antes, saia até ${hm(r.leave_by)}.</span>`;
  else txt += ` Isso vale para agora; perto do dia eu recalculo de onde você estiver.`;
  return txt + `<br><small style="color:var(--fg2)">${r.source === 'tomtom' ? 'Com o trânsito de agora' : 'Estimativa sem trânsito, com folga'}${prec} · ${hm(new Date(m.at).toISOString())}</small>`;
}
const n1 = v => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const GPS_OFF = 'Localização bloqueada. Libere a localização para o Meu Dia IA nos ajustes do celular (Safari ou Chrome → Localização → Permitir) e toque de novo.';
function gpsEta(e, ask){
  const paint = () => { const b = document.getElementById('gps-r'); if (b && $('#sheet').dataset.route === e.id) b.innerHTML = gpsTxt(e); };
  if (!navigator.geolocation){ gpsMem[e.id] = { err:'Este aparelho não informa a localização.', at:Date.now() }; paint(); return; }
  const prev = gpsMem[e.id];
  gpsMem[e.id] = { wait:true, at:Date.now() }; paint();
  const onPos = async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude, acc = pos.coords.accuracy;
    try { localStorage.setItem('meudia.wxok', '1'); localStorage.setItem('meudia.wxpos', JSON.stringify({ lat, lon })); localStorage.setItem('meudia.locat', String(Date.now())); } catch(x) {}
    sb.rpc('save_location', { p_lat: lat, p_lon: lon });
    const { data, error } = await sb.functions.invoke('rota', { body:{ action:'eta', id:e.id, lat, lon } });
    if (error || !data || data.error){ gpsMem[e.id] = { err:'Não consegui calcular o trajeto agora. Tente de novo.', at:Date.now() }; paint(); return; }
    gpsMem[e.id] = { r:data, acc, at:Date.now() };
    // compromisso nas próximas 4 h: a hora de sair passa a contar de onde você está
    const st = new Date(data.start_at).getTime();
    if (data.status === 'ok' && st > Date.now() && st - Date.now() < 4 * 3600e3){ e.tmin = data.travel_min; e.leave = new Date(Math.floor(new Date(data.leave_by).getTime() / 60e3) * 60e3).toISOString(); e.torig = 'atual'; e.tsrc = data.source; openRoute(e.id); return; }
    paint();
    const gb = document.querySelector('[data-gps]'); if (gb) gb.innerHTML = `${ic('nav')}Atualizar minha localização`;
  };
  const onErr = err => {
    gpsMem[e.id] = err.code === 1 ? { err:GPS_OFF, at:Date.now() }
      : (prev && prev.r ? prev : { err:'Não consegui pegar o sinal do GPS. Tente perto de uma janela ou ao ar livre.', at:Date.now() });
    if (!ask && err.code === 1){ try { localStorage.removeItem('meudia.wxok'); } catch(x) {} }
    paint();
  };
  navigator.geolocation.getCurrentPosition(onPos, err => {
    if (err.code === 1) return onErr(err);
    navigator.geolocation.getCurrentPosition(onPos, onErr, { enableHighAccuracy:false, timeout:15000, maximumAge:5 * 60e3 });
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
}
// cartão no Início: próxima saída nas próximas 18 h
function nextLeave(){
  const now = Date.now();
  const e = S.events.filter(x => hasLeave(x) && new Date(x.leave).getTime() > now - 30 * 60e3 && new Date(x.leave).getTime() < now + 18 * 3600e3)
    .sort((a, b) => a.leave.localeCompare(b.leave))[0];
  if (!e) return '';
  const late = new Date(e.leave).getTime() < now;
  return `<button class="leave-card ${late ? 'late' : ''}" data-route="${e.id}"><span class="lc-ic">${ic('nav')}</span>
    <span class="main"><span class="lc-t">${late ? 'Já passou da hora de sair' : `Sair ${rel(iso(new Date(e.leave))) === 'hoje' ? '' : rel(iso(new Date(e.leave))) + ' '}às ${hm(e.leave)}`}</span><span class="lc-s">${esc(e.title)} · ${e.tmin} min de viagem</span></span>
    <span class="lc-go">Waze</span></button>`;
}
function addrRow(k, label){

  return `<button class="row" data-addr="${k}"><span class="main"><div class="t">${label}</div><div class="s">${a.addr ? esc(a.addr) : 'Toque para cadastrar o endereço'}</div></span>${ic('r','i chev')}</button>`;
}
function themeSection(){

    <label class="row" for="th-mode"><span class="main t">Tema</span><select class="field-in" id="th-mode">${[['auto','Automático pelo horário'],['claro','Sempre claro'],['escuro','Sempre escuro'],['sistema','Igual ao celular']].map(([k,l]) => `<option value="${k}" ${c.mode === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    ${c.mode === 'auto' ? `<label class="row" for="th-dark"><span class="main t">Escuro a partir de</span><select class="field-in" id="th-dark">${opt(0, c.dark)}</select></label>
